<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">\n<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>[TEST] STUDY ROOM · 익명 누적 시험판 v0.6-B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2c1e; --muted:#7d6a55; --paper:#fbf6ea; --paper2:#f3ead6;
  --green:#2f9b6c; --green2:#e3f6ec; --amber:#e39b2d; --line:#e4d7bd;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2118;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.jua{font-family:'Jua',sans-serif;font-weight:400}

/* top */
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;pointer-events:none;
  background:linear-gradient(#2b2118ee 55%,#2b211800)}
.top *{pointer-events:auto}
.row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{color:#fff6e3;font-family:'Jua';font-size:20px;letter-spacing:.3px;line-height:1}
.brand small{display:block;font-family:'Gowun Dodum';font-size:11px;color:#d9c7a6;margin-top:3px;letter-spacing:0}
.dday{background:#ffe7a8;color:#5a3a10;border-radius:999px;padding:5px 10px;font-family:'Jua';font-size:14px;white-space:nowrap}
.dday i{font-style:normal;font-family:'Gowun Dodum';font-size:10px;opacity:.7;margin-left:3px}
.tabs{display:flex;gap:6px;margin-top:10px;background:#00000040;padding:4px;border-radius:14px}
.tab{flex:1;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:#e9dcc3;font-family:'Jua';font-size:14px;cursor:pointer}
.tab.on{background:var(--paper);color:var(--ink)}
.stats{display:flex;gap:10px;margin-top:8px;color:#efe3cc;font-size:12px;align-items:center}
.stats b{font-family:'Jua';font-weight:400;font-size:15px;color:#fff}
.mock{background:#ffffff1f;border-radius:99px;padding:2px 7px;font-size:10px;color:#e9dcc3}
.dot{width:7px;height:7px;border-radius:50%;background:#57e39b;box-shadow:0 0 0 3px #57e39b33;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #57e39b11}}

/* goal */
.goal{margin-top:8px;background:#fbf6eaee;border-radius:14px;padding:9px 11px;box-shadow:0 4px 14px #0003;cursor:pointer}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.goal .gt b{font-family:'Jua';font-weight:400;font-size:15px;color:var(--ink)}
.bar{height:9px;background:var(--paper2);border-radius:99px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#45c487,#2f9b6c);border-radius:99px;transition:width .6s}
.goal .gs{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.goal .gs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* labels */
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fffaf0ee;border-radius:12px;padding:3px 8px 4px;
  text-align:center;white-space:nowrap;box-shadow:0 2px 6px #0003;line-height:1.25;will-change:transform}
.bub .n{font-size:10px;color:var(--muted)}
.bub .s{font-size:12px;font-family:'Jua'}
.bub.brk{background:#fff1d6ee}
.bub.me{background:#e3f6ecf2;outline:2px solid var(--green)}
.bub:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#fffaf0ee}
.bub.me:after{border-top-color:var(--green)}
.trace{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:#1d150e99;color:#f3e6cf;font-size:10px;border-radius:99px;padding:2px 7px;white-space:nowrap}
.emo{position:absolute;font-size:26px;transform:translate(-50%,-100%);animation:fly 1.8s ease-out forwards}
@keyframes fly{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-70px;scale:1}}

/* hint & bottom chips */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 52px);background:#fbf6eaf0;padding:8px 14px;border-radius:99px;
  font-size:13px;box-shadow:0 4px 14px #0004;white-space:nowrap;transition:opacity .3s}
.foot{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 10px);display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;border:0;background:#00000066;color:#f0e2c8;font-size:11px;border-radius:99px;padding:7px 11px;font-family:inherit;cursor:pointer}
.chip b{color:#fff}
.chip.fast{background:var(--amber);color:#3a2205}

/* hud */
.hud{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 48px);background:var(--paper);border-radius:20px;padding:12px 14px;box-shadow:0 8px 28px #0006;
  display:none;max-width:480px;margin:0 auto}
.hud.show{display:block;animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.hud .h1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{background:var(--green2);color:#1f6e4b;border-radius:99px;padding:3px 10px;font-size:12px;font-family:'Jua'}
.time{font-family:'Jua';font-size:40px;line-height:1;letter-spacing:1px}
.hud .h2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted);gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-family:'Jua';font-size:15px;cursor:pointer;background:var(--paper2);color:var(--ink)}
.btn.pri{background:var(--green);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:active{transform:scale(.97)}

/* sheet */
.dim{position:fixed;inset:0;background:#0006;display:none}
.dim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 16px);
  max-height:84vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;max-width:520px;margin:0 auto;box-shadow:0 -6px 30px #0005}
.sheet.show{transform:none}
.sheet h3{margin:2px 0 4px;font-family:'Jua';font-weight:400;font-size:21px}
.sheet .lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.fld{margin:12px 0}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--green);background:var(--green2);color:#1f6e4b;font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--green)}
.nick{display:flex;align-items:center;gap:8px}
.nick .nv{font-family:'Jua';font-size:20px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.note{font-size:11px;color:var(--muted);margin-top:5px}
.tog{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.tog input{width:44px;height:24px;accent-color:var(--green)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.vstack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.big{font-size:44px;text-align:center;margin:6px 0 2px}
.rec{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;margin-top:6px}
.rec b{font-family:'Jua';font-weight:400;font-size:16px}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.rules li b{font-family:'Jua';font-weight:400}
.cheers{display:flex;gap:8px;margin-top:10px}
.cheers .btn{flex:1;font-size:14px;padding:12px 4px}
.cheers .btn span{display:block;font-size:24px}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-140%);background:#2f2419f2;color:#fff6e3;padding:10px 16px;border-radius:14px;font-size:13px;
  box-shadow:0 6px 20px #0006;transition:transform .3s;max-width:90vw;text-align:center;z-index:9}
.toast.show{transform:translate(-50%,0)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e9dcc3;font-family:'Jua';font-size:18px}
@media (min-width:760px){.top{padding-left:20px;padding-right:20px}.top .wrap{max-width:520px}}

.school-choice{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.school-choice small,.rec small{display:block;color:var(--muted);font:12px 'Gowun Dodum',sans-serif}
.section-caption{font-family:'Jua';font-size:15px;color:var(--green);margin:13px 0 6px}
.record-notice{background:#f5ecd5;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.record-notice p{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.6}
#schoolSearch:focus{outline:2px solid var(--green)}
#hMsg{max-width:55%;line-height:1.3}
@media(max-width:370px){.brand{font-size:16px}.chip{font-size:10px;padding:6px 8px}.h2{font-size:10px!important}}
</style>
<style>#sr-stage-label{position:fixed;right:12px;top:12px;z-index:999999;background:#1f2937;color:#fff;font:600 11px/1.4 system-ui,sans-serif;padding:6px 9px;border-radius:7px;pointer-events:none;opacity:.92}</style>
</head>
<body>
<div id="sr-stage-label">v0.6-B TEST · 공개 금지</div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="loading" id="loading">열람실 불 켜는 중…</div>

<div class="top"><div class="wrap">
  <div class="row1">
    <div class="brand">STUDY ROOM <small>익명으로 바로 공부 · 오늘과 전체 기록은 서버에 보관</small></div>
    <div class="dday" id="dday">기말 D-27<i>가상</i></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="roomBtn">🚪 열람실 고르기 ▾</button>
  </div>
  <div class="stats"><span><span class="dot"></span>현재 착석 <b id="stNow">0명</b></span><span>열람실 접속 <b id="stToday">0명</b></span><span class="mock" id="conn">연결 중…</span></div>
  <div class="goal" id="goal"></div>
</div></div>

<div class="hint" id="hint">빈 책상을 눌러 시작하세요 · 손가락으로 둘러보기</div>

<div class="hud" id="hud">
  <div class="h1">
    <div><span class="sub" id="hSub">한국사</span><div class="time" id="hTime">25:00</div></div>
    <div style="display:flex;gap:6px"><button class="btn sm" id="breakBtn" aria-label="쉬는 시간">☕ 쉬기</button><button class="btn sm" id="hStop">공부 끝내기</button></div>
  </div>
  <div class="bar"><i id="hBar" style="width:0%"></i></div>
  <div class="h2"><span id="hMsg">서버 기록을 연결 중입니다</span><span id="hToday"></span></div>
</div>

<div class="foot">
  <button class="chip" id="myRec">📊 기록 불러오는 중…</button>
  <button class="chip" id="schoolBtn">🏫 학교 선택</button>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const fmtClock=s=>{s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const fmtMin=s=>Math.floor(s/60)+'분';

if(!window.THREE){$('#loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요.';return;}

/* ---------- data ---------- */
const SUBJECTS=['국어','수학','영어','한국사','통합사회','통합과학','기타'];
const ADJ=['푸른','조용한','반짝','느긋한','단단한','새벽','포근한','맑은','작은','용감한','성실한','몽글'];
const NOUN=['별','고래','연필','부엉이','나무','구름','책갈피','등대','다람쥐','노트','달','펭귄'];
const genNick=()=>pick(ADJ)+pick(NOUN)+Math.floor(rnd(10,99));
const SCHOOLS=['복정고','한빛고','새솔고'];
const GRADES=['1학년','2학년','3학년'];
const SKIN=['#f2c9a0','#e9b88f','#f6d6b8','#dda57c'];
const HAIR=['#2a1d15','#3b2a1e','#151110','#5a3a22','#7a5634'];
const SHIRT=['#efe8d6','#8fae8b','#c97b5a','#6d8fb3','#d9b45a','#a98bc0','#e58f8f'];
const BOOK=['#2f4a3a','#7a3b2a','#c9b98a','#1f3550','#5a4a2a','#a8a07a','#3d2a1e','#e8dcc0','#4f6b4a','#8b5a3c','#26323f'];
const AGO=['5분 전','30분 전','1시간 전','2시간 전','3시간 전'];

function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem('sr4_'+k))}localStorage.setItem('sr4_'+k,JSON.stringify(v))}catch(e){return null}}
const kstDay=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
const kstHour=()=>(+new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',hour:'numeric',hourCycle:'h23'}).format(new Date()))%24;
const todayKey=kstDay();
let saved=store('me')||{};
// 날짜별 기록: hist[YYYY-MM-DD] = {sec: 공부 초, daySec: 심야 제외 초}
let hist=store('hist')||{};
if(saved.day&&saved.min&&!hist[saved.day]){hist[saved.day]={sec:saved.min*60,daySec:(saved.dayMin||0)*60};store('hist',hist)} // 이전 버전 기록은 바로 새 구조로 저장
const H=3600e3,DAY=24*H,KST=9*H;
const keyOf=ms=>new Date(Math.floor((ms+KST)/DAY)*DAY).toISOString().slice(0,10);
// 실제 시각 구간 [a,b]를 한국 날짜·심야(0~6시) 단위로 나눔
function splitInterval(a,b){
  const out={};let t=a;
  while(t<b){
    const k=t+KST, ds=Math.floor(k/DAY)*DAY, six=ds+6*H, next=k<six?six:ds+DAY;
    const end=Math.min(b,next-KST), sec=(end-t)/1000, key=new Date(ds).toISOString().slice(0,10);
    const o=out[key]||(out[key]={sec:0,night:0});o.sec+=sec;if(k<six)o.night+=sec;
    t=end;
  }
  return out;
}
const dayRec=d=>hist[d]||{sec:0,daySec:0};
function saveHist(){const keys=Object.keys(hist).sort();while(keys.length>21)delete hist[keys.shift()];store('hist',hist)}
const me={
  nick:saved.nick||genNick(), hair:saved.hair??0, shirt:saved.shirt??3, skin:0, bun:true,
  day:todayKey, buckets:{}, showSchool:false,
  seat:null, room:null, subject:'한국사', len:1500, elapsed:0, state:null, breakLeft:0, wasHidden:false
};
const saveMe=()=>store('me',{day:me.day,nick:me.nick,hair:me.hair,shirt:me.shirt});
const pointsFor=m=>(m>=20?1:0)+(m>=50?1:0);
const ptsOf=d=>pointsFor(dayRec(d).daySec/60);
const myPts=()=>ptsOf(kstDay());
const todayMinF=()=>Math.floor(dayRec(kstDay()).sec/60);

function npc(kind){
  return {nick:genNick(),grade:pick(GRADES),school:kind==='school'?'복정고':pick(SCHOOLS),showSchool:Math.random()<.55,
    subject:pick(SUBJECTS),elapsed:rnd(60,2600),len:pick([1500,3000,3000]),state:'study',breakLeft:0,
    look:{skin:pick(SKIN),hair:pick(HAIR),shirt:pick(SHIRT),bun:Math.random()<.5}};
}
function makeSeats(kind,fill){return Array.from({length:12},(_,idx)=>({idx,occ:null,trace:null}));}
const rooms={};
['public-1','public-2','public-3','public-4','public-5'].forEach(k=>rooms[k]={seats:makeSeats(k,0),today:0,goal:{}});
let roomKey='public-1';
let speed=1;

/* ---------- three ---------- */
const canvas=$('#c');
let renderer;
try { renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }
catch(e){$('#loading').textContent='이 브라우저에서 3D를 실행할 수 없어요. Chrome을 최신 상태로 업데이트하고 그래픽 가속(WebGL)을 확인해 주세요.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#2b2118');
scene.fog=new THREE.Fog('#2b2118',22,42);
const camera=new THREE.PerspectiveCamera(40,1,.1,100);
scene.add(new THREE.HemisphereLight('#fff1dc','#5a4128',.78));
const sun=new THREE.DirectionalLight('#ffe2b8',.62);
sun.position.set(5,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40});
sun.shadow.bias=-.002;
scene.add(sun);
const warm=new THREE.PointLight('#ffcf85',.35,18);warm.position.set(0,4,0);scene.add(warm);

const matCache={};
const M=(c,o)=>{const k=c+(o?JSON.stringify(o):'');return matCache[k]||(matCache[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})))};
const box=(w,h,d,c,x,y,z,parent,shadow=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent&&parent.add(m);return m};
const sph=(r,c,x,y,z,parent,seg=16)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.round(seg*.75)),M(c));m.position.set(x,y,z);m.castShadow=true;parent&&parent.add(m);return m};
const cyl=(rt,rb,h,c,x,y,z,parent,seg=14)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent&&parent.add(m);return m};

let L=null; // layout
let roomGroup=null;
const seatObjs=[]; // {g, hit, char, x, z, deskTopY}
const plants=[];

function computeLayout(){
  const portrait=innerWidth/innerHeight<.85;
  const cols=portrait?2:4, rows=12/cols, dx=portrait?1.95:2.3, dz=2.15;
  const seats=[];
  for(let i=0;i<12;i++){const c=i%cols,r=Math.floor(i/cols);seats.push({x:(c-(cols-1)/2)*dx,z:(r-(rows-1)/2)*dz})}
  const halfW=cols*dx/2+1.0, halfD=rows*dz/2+1.1, maxZ=Math.max(...seats.map(q=>q.z));
  const aisles=[];for(let c=0;c<cols-1;c++)aisles.push((c+.5-(cols-1)/2)*dx);
  return {portrait,cols,rows,dx,dz,seats,halfW,halfD,frontZ:maxZ+1.5,door:{x:halfW-.35,z:maxZ+1.5},aisles};
}

function bookshelf(w,h,parent,x,z,ry){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry||0;parent.add(g);
  const d=.42, fc='#6b4a2e';
  box(.08,h,d,fc,-w/2,h/2,0,g);box(.08,h,d,fc,w/2,h/2,0,g);box(w,h,.04,'#4e3522',0,h/2,-d/2+.02,g,false);
  const shelves=Math.max(3,Math.round(h/.62));
  for(let s=0;s<=shelves;s++){
    const y=s*(h-.06)/shelves+.03;box(w,.06,d,fc,0,y,0,g);
    if(s===shelves)break;
    const sh=(h-.06)/shelves-.08;
    let bx=-w/2+.08;
    while(bx<w/2-.14){
      const bw=rnd(.07,.15), bh=sh*rnd(.62,.95);
      if(Math.random()<.08){bx+=bw*1.5;continue}
      const b=box(bw,bh,d*.8,pick(BOOK),bx+bw/2,y+.03+bh/2,.02,g,false);
      if(Math.random()<.06){b.rotation.z=-.18;b.position.x+=.03}
      bx+=bw+.008;
    }
  }
  return g;
}

function buildRoom(){
  if(roomGroup){scene.remove(roomGroup);roomGroup.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  seatObjs.length=0;plants.length=0;walkers.length=0;
  L=computeLayout();
  roomGroup=new THREE.Group();scene.add(roomGroup);
  const W=L.halfW, D=L.halfD;
  const pub=true;
  const wall=pub?'#b7b48e':'#cdb88f', floor=pub?'#8a7350':'#9b7a52';
  // floor + planks
  const f=new THREE.Mesh(new THREE.PlaneGeometry(W*2,D*2+4),M(floor));f.rotation.x=-Math.PI/2;f.position.z=1.5;f.receiveShadow=true;roomGroup.add(f);
  for(let x=-W;x<W;x+=.7){const p=new THREE.Mesh(new THREE.PlaneGeometry(.015,D*2+4),M('#7d5f3f'));p.rotation.x=-Math.PI/2;p.position.set(x,.002,1.5);roomGroup.add(p)}
  const rug=new THREE.Mesh(new THREE.PlaneGeometry(W*2-1.6,D*2-1.4),M(pub?'#6c6a48':'#7a5a3c'));rug.rotation.x=-Math.PI/2;rug.position.y=.004;rug.receiveShadow=true;roomGroup.add(rug);
  // walls
  box(W*2+.4,4.2,.2,wall,0,2.1,-D-.1,roomGroup,false);
  box(.2,4.2,D*2+4,wall,-W-.1,2.1,1.5,roomGroup,false);
  box(.2,4.2,D*2+4,wall,W+.1,2.1,1.5,roomGroup,false);
  box(W*2+.4,.18,.24,'#6b4a2e',0,.09,-D+.02,roomGroup,false);
  // back shelves
  const bw=1.9, n=Math.max(2,Math.floor((W*2-.3)/bw));
  for(let i=0;i<n;i++)bookshelf(bw-.06,3.1,roomGroup,(i-(n-1)/2)*bw,-D+.25,0);
  // side shelves + window
  const sideLen=D*2;
  const sn=Math.max(1,Math.floor((sideLen-2.2)/bw));
  for(let i=0;i<sn;i++){
    const z=-D+1.3+i*bw;
    if(i===1){ // window slot on left
      const wz=z;
      box(.06,1.6,1.7,'#cfe6c3',-W+.02,2.15,wz,roomGroup,false).material=new THREE.MeshBasicMaterial({color:'#d6ecc8'});
      box(.12,.08,1.8,'#6b4a2e',-W+.06,2.95,wz,roomGroup,false);box(.12,.08,1.8,'#6b4a2e',-W+.06,1.35,wz,roomGroup,false);
      box(.12,1.6,.06,'#6b4a2e',-W+.06,2.15,wz,roomGroup,false);
      box(.34,.06,1.9,'#7a5634',-W+.17,1.3,wz,roomGroup);
      [-.55,0,.55].forEach(o=>plants.push(makePlant(-W+.2,1.33,wz+o,.55)));
      bookshelf(bw-.06,3.1,roomGroup,W-.25,z,-Math.PI/2);
      continue;
    }
    bookshelf(bw-.06,3.1,roomGroup,-W+.25,z,Math.PI/2);
    bookshelf(bw-.06,3.1,roomGroup,W-.25,z,-Math.PI/2);
  }
  // corner plants (unlock)
  plants.push(makePlant(-W+.6,0,L.frontZ+.9,1.1),makePlant(-W+.6,0,-D+.9,1),makePlant(W-.6,0,-D+.9,1));
  // door (right wall, front)
  const dz0=L.door.z;
  box(.1,2.1,1.1,'#4e3522',W-.03,1.05,dz0,roomGroup,false);
  box(.06,1.95,.95,'#8a5f33',W-.06,.98,dz0,roomGroup,false);
  sph(.04,'#e0c27a',W-.1,1.0,dz0-.32,roomGroup,8);
  box(.14,.12,1.3,'#4e3522',W-.05,2.14,dz0,roomGroup,false);
  const mat=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.1),M('#5a6b4a'));mat.rotation.x=-Math.PI/2;mat.position.set(W-.55,.006,dz0);mat.receiveShadow=true;roomGroup.add(mat);
  const ds=makeSign('🚪 입구');ds.scale.setScalar(.45);ds.rotation.y=-Math.PI/2;ds.position.set(W-.04,2.42,dz0);roomGroup.add(ds);
  // sign
  const sign=makeSign('📚 '+roomTitle());sign.position.set(0,3.55,-D+.02);roomGroup.add(sign);
  // desks
  L.seats.forEach((p,i)=>{
    const g=new THREE.Group();g.position.set(p.x,0,p.z);roomGroup.add(g);
    const dw=1.15, dd=.7, dh=.76;
    box(dw,.07,dd,'#a3743f',0,dh,0,g);
    box(dw-.06,.32,.04,'#8a5f33',0,dh-.2,dd/2-.04,g); // modesty panel (front)
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.06,dh,.06,'#7a5230',a*(dw/2-.05),dh/2,b*(dd/2-.05),g));
    // lamp
    cyl(.1,.12,.04,'#5b3f28',-dw/2+.18,dh+.05,-.18,g);
    const st=cyl(.018,.018,.32,'#5b3f28',-dw/2+.18,dh+.2,-.18,g);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),new THREE.MeshBasicMaterial({color:'#fff0c8'}));bulb.position.set(-dw/2+.18,dh+.42,-.18);g.add(bulb);
    const glow=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),new THREE.MeshBasicMaterial({color:'#ffd27a',transparent:true,opacity:.16,depthWrite:false}));glow.position.copy(bulb.position);g.add(glow);
    // paper + books
    const paper=box(.34,.008,.24,'#f6f1e4',.08,dh+.04,.06,g,false);paper.rotation.y=.12;
    for(let k=0;k<3;k++)box(.26,.05,.18,pick(BOOK),dw/2-.2,dh+.06+k*.05,-.15,g).rotation.y=rnd(-.2,.2);
    // chair
    const cz=-.62;
    box(.5,.06,.46,'#7a5230',0,.45,cz,g);
    box(.5,.5,.06,'#7a5230',0,.72,cz-.22,g);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.05,.45,.05,'#5e3f25',a*.21,.22,cz+b*.19,g));
    // hit area
    const hit=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.45,1.7),new THREE.MeshBasicMaterial({visible:false}));hit.position.set(0,.72,-.25);hit.userData.seat=i;g.add(hit);
    seatObjs.push({g,hit,char:null,x:p.x,z:p.z,lampGlow:glow,ring:null});
  });
  updatePlants(true);
  rebuildChars();
  fitCamera(true);
}

function makeSign(text){
  const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
  x.fillStyle='#4e3522';x.fillRect(0,0,512,96);x.strokeStyle='#c9a46a';x.lineWidth=6;x.strokeRect(6,6,500,84);
  x.fillStyle='#ffe9b8';x.font='44px Jua, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,52);
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.49),new THREE.MeshBasicMaterial({map:t}));m.position.z=.12;
  m.userData.redraw=()=>{x.fillStyle='#4e3522';x.fillRect(8,8,496,80);x.fillStyle='#ffe9b8';x.font='44px Jua, sans-serif';x.fillText(text,256,52);t.needsUpdate=true};
  document.fonts&&document.fonts.ready.then(()=>m.userData.redraw());

function makePlant(x,y,z,s){
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(.001);roomGroup.add(g);
  cyl(.16*s,.12*s,.24*s,'#c07a4f',0,.12*s,0,g);
  const leaf=['#4f8a4a','#5fa055','#3f7a3f'];
  for(let i=0;i<5;i++){const l=sph(.13*s,pick(leaf),rnd(-.08,.08)*s,(.3+i*.07)*s,rnd(-.08,.08)*s,g,8);l.scale.set(1,1.4,1)}
  g.userData.target=0;return g;
}
function updatePlants(instant){
  const on=false;
  plants.forEach(p=>{p.userData.target=on?1:0;if(instant)p.scale.setScalar(on?1:.001)});
}

/* character */
function makeChar(look,mine){
  const g=new THREE.Group();
  const body=cyl(.2,.25,.5,look.shirt,0,.7,0,g);
  const neck=cyl(.07,.07,.08,look.skin,0,.97,0,g);
  const head=new THREE.Group();head.position.set(0,1.18,0);g.add(head);
  sph(.23,look.skin,0,0,0,head,20);
  const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.245,20,14,0,Math.PI*2,0,Math.PI*.56),M(look.hair));hairCap.rotation.x=-.42;hairCap.castShadow=true;head.add(hairCap);
  if(look.bun)sph(.11,look.hair,0,.2,-.13,head,12);
  else{const fr=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10,0,Math.PI*2,0,Math.PI*.32),M(look.hair));fr.rotation.x=.25;head.add(fr)}
  sph(.027,'#2a1d15',-.085,-.01,.205,head,8);sph(.027,'#2a1d15',.085,-.01,.205,head,8);
  sph(.04,'#f0a0a0',-.13,-.07,.17,head,8);sph(.04,'#f0a0a0',.13,-.07,.17,head,8);
  sph(.022,'#d98a6a',0,-.05,.225,head,8);
  const arm=(side)=>{
    const p=new THREE.Group();p.position.set(side*.24,.88,0);g.add(p);
    cyl(.06,.055,.4,look.shirt,0,-.2,0,p,10);
    sph(.06,look.skin,0,-.42,0,p,10);
    p.rotation.x=-1.15;p.rotation.z=side*-.25;
    return p;
  };
  const rA=arm(1), lA=arm(-1);
  const leg=(side)=>{
    const p=new THREE.Group();p.position.set(side*.1,.47,0);g.add(p);
    cyl(.075,.068,.44,'#45405a',0,-.22,0,p,10);
    const shoe=sph(.085,'#2a2420',0,-.45,.04,p,8);shoe.scale.set(1,.7,1.3);
    p.rotation.x=-1.5;return p;
  };
  const lL=leg(-1), lR=leg(1);
  const pen=cyl(.012,.012,.2,'#222',0,-.44,.05,rA,6);pen.rotation.x=.6;
  if(mine){
    const ring=new THREE.Mesh(new THREE.RingGeometry(.42,.52,32),new THREE.MeshBasicMaterial({color:'#57e39b',transparent:true,opacity:.85,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2;ring.position.y=.012;g.add(ring);g.userData.ring=ring;
  }
  g.userData.parts={head,rA,lA,body,lL,lR};g.userData.phase=Math.random()*10;
  g.userData.pop=0;g.userData.leaving=false;
  g.scale.setScalar(.001);
  return g;
}
const myLook=()=>({skin:SKIN[me.skin],hair:HAIR[me.hair],shirt:SHIRT[me.shirt],bun:me.bun});

const walkers=[]; // characters walking out (no seat)
const WALK=2.8;
const aisleX=x=>L.aisles.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,L.aisles[0]);
function pathIn(i){const q=L.seats[i],ax=aisleX(q.x),cz=q.z-1.33;return [[ax,L.frontZ],[ax,cz],[q.x,cz],[q.x,q.z-.58]]}
function pathOut(i){const q=L.seats[i],ax=aisleX(q.x),cz=q.z-1.33;return [[q.x,cz],[ax,cz],[ax,L.frontZ],[L.door.x+.2,L.door.z]]}
function placeChar(i,mode,onArrive){
  const so=seatObjs[i];const seat=rooms[roomKey].seats[i];
  if(so.char){roomGroup.remove(so.char);so.char=null}
  if(!seat.occ)return;
  const mine=seat.occ.mine;
  const c=makeChar(mine?myLook():seat.occ.look,mine);
  roomGroup.add(c);so.char=c;
  const u=c.userData;
  if(mode==='enter'){
    c.position.set(L.door.x,0,L.door.z);c.rotation.y=-Math.PI/2;
    u.path=pathIn(i);u.seated=false;u.onArrive=onArrive;
    u.parts.lL.rotation.x=u.parts.lR.rotation.x=0;
  }else{
    c.position.set(so.x,0,so.z-.58);u.seated=true;c.scale.setScalar(1);u.pop=1;
  }
}
function walkOut(i){
  const so=seatObjs[i];const c=so.char;if(!c)return;
  so.char=null;const u=c.userData;
  u.seated=false;u.path=pathOut(i);u.exiting=true;u.onArrive=null;
  walkers.push(c);
}
function rebuildChars(){
  walkers.length=0;
  // 실시간 접속자의 walk 상태는 서버에서 온 그대로 유지
  seatObjs.forEach((_,i)=>placeChar(i,'sit'));rebuildLabels()}

/* ---------- camera ---------- */
let camZ=0, camZTarget=0, zoom=1, zoomTarget=1;
const dir=new THREE.Vector3(0,.64,.77).normalize();
function camRange(){const zs=L.seats.map(s=>s.z);const mn=Math.min(...zs),mx=Math.max(...zs);return L.portrait?[mn+.6,mx-1.2]:[mn*.5-.3,mx*.3]}
function fitCamera(reset){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=L.portrait?44:38;camera.updateProjectionMatrix();
  if(reset){const r=camRange();camZ=camZTarget=L.portrait?r[0]+.6:-.6}
}
function updateCamera(dt){
  const k=1-Math.pow(.002,dt);
  camZ+=(camZTarget-camZ)*k;zoom+=(zoomTarget-zoom)*k;
  const need=L.cols*L.dx/2+.55;
  let d=need/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect);
  d=Math.max(L.portrait?8:12.5,d)*zoom;
  const tgt=new THREE.Vector3(0,.7,camZ);
  camera.position.copy(tgt).addScaledVector(dir,d);
  camera.lookAt(tgt);
}

/* ---------- input ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,z:camZTarget,moved:false,id:e.pointerId}});
canvas.addEventListener('pointermove',e=>{
  if(!down)return;const dy=e.clientY-down.y,dx=e.clientX-down.x;
  if(Math.hypot(dx,dy)>8)down.moved=true;
  if(down.moved){following=false;const r=camRange();camZTarget=Math.min(r[1],Math.max(r[0],down.z-dy*.022))}
});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const wasTap=!down.moved;down=null;
  if(!wasTap)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(seatObjs.map(s=>s.hit));
  if(hits.length)onSeatTap(hits[0].object.userData.seat);
});
canvas.addEventListener('wheel',e=>{const r=camRange();camZTarget=Math.min(r[1],Math.max(r[0],camZTarget+e.deltaY*.01))},{passive:true});

async function rpc(name,args={}){if(!sb)throw new Error('connection_unavailable');const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function checkOk(r){if(!r||r.ok===false)throw new Error(r?.error||'server_response_failed');return r}
function queueTransition(fn){const task=stateQueue.catch(()=>{}).then(fn);stateQueue=task.catch(presentError);return task}
function queueHistory(fn){const task=historyQueue.catch(()=>{}).then(fn);historyQueue=task;return task}
async function histEvent(action){if(!localSessionId)return null;return queueHistory(async()=>{
 const sid=localSessionId, requestId=id4();let response;
 for(let attempt=0;attempt<2;attempt++){
   try{response=checkOk(await rpc('sr6_study_event',{p_session_id:sid,p_action:action,p_request_id:requestId}));break}
   catch(e){if(attempt)throw e}
 }
 localStatus=response.status;
 if(response.credited_seconds!=null)me.elapsed=Math.max(me.elapsed,+response.credited_seconds);
 if(localStatus==='interrupted'||localStatus==='completed'){clearInterval(historyTimer);historyTimer=null;}
 return response;
});}
function clearHistoryTimer(){clearInterval(historyTimer);historyTimer=null}
function startHistoryTimer(){clearHistoryTimer();if(localStatus!=='running'||!activeTab)return;
 const delay=me.mode==='self'?45000:15000;
 historyTimer=setInterval(()=>{if(!activeTab||localStatus!=='running')return;histEvent('ping').then(r=>{
 if(!r)return;if(r.status==='interrupted'){toast('연결이 끊겨 공부 기록이 중단됐어요. 다시 시작해 주세요.',5000);sessionErr=true;updateHud()}
 }).catch(e=>{sessionErr=true;presentError(e);updateHud()})},delay);
}
async function startHistory(){
 if(localSessionId&&localStatus==='running'){startHistoryTimer();return}
 if(localSessionId&&localStatus==='paused'){
  const r=await histEvent('resume');
  if(r?.status==='running'){sessionErr=false;startHistoryTimer();return}
 }
 const reqId=id4();
 let response;
 for(let a=0;a<2;a++){
   try{response=checkOk(await rpc('sr6_study_begin',{p_request_id:reqId}));break}
   catch(e){if(a===1)throw e}
 }
 localSessionId=response.session_id;localStatus=response.status;me.mode=response.mode||me.mode;
 sessionErr=false;me.elapsed=+response.credited_seconds||0;startHistoryTimer();updateHud();
}

 else if(me.state==='break'){$('#hSub').textContent='☕ 휴식';$('#hTime').textContent=fmtClock(me.breakLeft);$('#hBar').style.width=(100-me.breakLeft/300*100)+'%';$('#hMsg').textContent='휴식 시간은 기록하지 않아요';}
 else {$('#hSub').textContent=label;$('#hTime').textContent=fmtClock(Math.max(0,me.len-me.elapsed));$('#hBar').style.width=Math.min(100,me.elapsed/me.len*100)+'%';
 $('#hMsg').textContent=sessionErr?'⚠ 기록 연결 오류 · 종료하지 말고 재시도':me.pausedAway?'⏸ 다른 창 이용 중 · 집중 시간 정지':me.mode==='self'?'☑ 자율 기록 중 · 자기 신고 시간':'✅ 서버에 공부 시간 저장 중';}
 $('#hStop').textContent=me.state==='walk'?'앉기 취소':me.state==='break'?'그만하기':'공부 끝내기';$('#breakBtn').textContent=me.state==='break'?'▶ 계속':'☕ 쉬기';$('#breakBtn').disabled=me.state==='walk';$('#hToday').textContent='누적 집중 '+fmtDuration(getAllSec('focus'))+' · 자율 '+fmtDuration(getAllSec('self'));
}

async function captchaToken(){if(!TURNSTILE_SITE_KEY)return null;
 openSheet('<h3>안전한 접속 확인</h3><p class="lead">봇 접속을 차단하기 위한 확인입니다.</p><div id="captcha-slot"></div>','captcha');

async function authorize(){if(!CAPTCHA_SERVER_READY)throw new Error('Supabase CAPTCHA 서버 설정 확인 전이므로 시험판 인증이 잠겨 있습니다.');if(!window.supabase)throw new Error('Supabase JS 라이브러리 로드 실패');if(!sb)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 let {data,error}=await sb.auth.getSession();if(error)throw error;
 if(!data.session){if(!TURNSTILE_SITE_KEY)throw new Error('시험판 인증 준비 중입니다. Cloudflare Turnstile Site Key 연결 후 새 익명 계정을 생성할 수 있습니다.');const cap=await captchaToken();const a=await sb.auth.signInAnonymously(cap?{options:{captchaToken:cap}}:undefined);if(a.error)throw a.error;data=a.data;}

async function connect(){if(!activeTab||isConnecting)return;isConnecting=true;renderStats();
 try{await authorize();const t0=Date.now();const hb=await rpc('sr6_heartbeat');const t1=Date.now();serverOffset=Date.parse(hb.now)-(t0+t1)/2;
  const sc=hb.school;if(sc?.code){schoolChoice={code:sc.code,name:sc.name,sido:sc.sido};schoolName=sc.name;}
  else{schoolChoice=null;schoolName='';}
  let k='public-1';if(hb.seat){k=hb.seat.room;ensureRoom(k);liveId=hb.seat.presence_id;recoveryActive=true;

      if(localStatus==='running')startHistoryTimer();}
  }
  liveConnected=true;isConnecting=false;
  await enterRoom(k);
  await refreshTotals();renderStats();renderGoal();renderRoomButton();
  clearInterval(hbTimer);hbTimer=setInterval(heartbeat,20000);
  if(recoveryActive){recoveryActive=false;toast('이전 자리를 확인했어요. 공부 기록을 동기화합니다.',3500);
   if(me.mode==='focus'&&studyWindowActive()&&me.pausedAway)reenterFocus();
   else if(!localSessionId&&me.state==='study'&&(me.mode==='self'||studyWindowActive()))queueTransition(async()=>{checkOk(await rpc('sr6_state',{p_state:'study'}));await startHistory()}).catch(()=>{sessionErr=true;updateHud()});
  }

}
async function heartbeat(){if(!activeTab||!sb||!session)return;try{const t=Date.now();const h=await rpc('sr6_heartbeat');serverOffset=Date.parse(h.now)-t;if(!liveConnected){liveConnected=true;renderStats();refetch();}
 if(me.seat!==null&&!h.seat){clearHistoryTimer();sessionErr=true;me.seat=null;me.room=null;me.state=null;$('#hud').classList.remove('show');toast('서버에서 자리가 종료됐어요. 누적 기록은 보존됩니다.',4600);await refreshTotals();}
 }catch(e){liveConnected=false;renderStats();presentError(e)}}

 openSheet(`<h3>🏫 우리 학교 선택</h3><p class="lead">학교는 본인이 선택하며 재학 여부를 확인하지 않습니다. 실명·학번을 묻지 않아요.</p><div class="fld"><input id="schoolSearch" placeholder="학교명 두 글자 이상 검색" autocomplete="off" spellcheck="false" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px"></div><div id="schoolResults" class="vstack"><p class="lead">학교를 검색해 주세요.</p></div><div class="vstack"><button class="btn" data-a="clear-school">학교 선택 해제</button><button class="btn" data-a="close">닫기</button></div>`,'school');
 const list=$('#schoolResults'), search=$('#schoolSearch');let seq=0,timer=null;
 search.addEventListener('input',()=>{clearTimeout(timer);const value=search.value;const run=++seq;if(value.trim().length<2){list.innerHTML='<p class="lead">두 글자 이상 입력하세요.</p>';return}list.innerHTML='<p class="lead">찾는 중…</p>';timer=setTimeout(async()=>{try{const found=await schoolSearch(value);if(run!==seq||sheetMode!=='school')return;list.innerHTML=found.length?found.map(schoolCard).join(''):'<p class="lead">검색 결과가 없습니다.</p>'}catch(e){list.innerHTML='<p class="lead">검색에 실패했습니다.</p>';presentError(e)}},250)});
 $sheet.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='close'){closeSheet();return}

 b.disabled=true;try{checkOk(await rpc('sr6_set_school',{p_code:code}));schoolChoice=code?{code,name:b.dataset.name,sido:b.dataset.sido}:null;schoolName=schoolChoice?.name||'';closeSheet();if(roomKey.startsWith('sch-')&&(!schoolChoice||!roomKey.startsWith('sch-'+schoolChoice.code+'-')))await enterRoom('public-1');renderGoal();renderRoomButton();toast(code?'학교를 선택했어요. 학교 열람실을 열 수 있어요.':'학교 선택을 해제했어요');showRoomPicker()}catch(err){b.disabled=false;presentError(err)}
 };

async function showRoomPicker(){if(!liveConnected){toast('연결 중이에요');return}if(me.seat!==null){toast('공부 중에는 방을 옮길 수 없어요');return}

 $sheet.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='school'){showSchoolPicker();return}if(b.dataset.room){closeSheet();if(b.dataset.room!==roomKey)enterRoom(b.dataset.room).catch(presentError)}};

async function enterRoom(k){if(!ROOM_RE.test(k))throw new Error('invalid_room');if(k.startsWith('sch-')&&(!schoolChoice||!k.startsWith('sch-'+schoolChoice.code+'-')))throw new Error('not_my_school');
 if(roomChannel){try{await sb.removeChannel(roomChannel)}catch(e){}roomChannel=null}
 ensureRoom(k);roomKey=k;rooms[k].seats=makeSeats(k,0);liveOccupied=0;liveViewers=0;
 buildRoom();renderRoomButton();renderGoal();renderStats();
 const ch=sb.channel('room6:'+k,{config:{presence:{key:session.user.id.slice(0,8)}}});
 ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'seats6',filter:'room=eq.'+k},scheduleRefetch)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'seats6',filter:'room=eq.'+k},scheduleRefetch)
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'seats6'},scheduleRefetch)
  .on('presence',{event:'sync'},()=>{liveViewers=Object.keys(ch.presenceState()).length;renderStats()})
  .on('broadcast',{event:'cheer'},({payload})=>{if(!payload||!Number.isInteger(payload.seat)||!['👏','🔥','☕'].includes(payload.emoji))return;
    if(seatObjs[payload.seat])floatEmoji(payload.seat,payload.emoji);if(me.seat===payload.seat)toast('누군가 응원을 보냈어요 '+payload.emoji);})
  .subscribe(async status=>{if(status==='SUBSCRIBED'){try{await ch.track({at:Date.now()})}catch(e){}scheduleRefetch()}});
 roomChannel=ch;await refetch();
}
function scheduleRefetch(){clearTimeout(refetchT);refetchT=setTimeout(refetch,160)}
async function refetch(){if(!sb||!roomKey)return;const key=roomKey;
 const {data,error}=await sb.from('seats6').select('room,seat_no,presence_id,nick,subject,look,mode,state,focus_acc,state_at').eq('room',key);
 if(key!==roomKey)return;if(error){presentError(error);return}
 const now=Date.now()+serverOffset;const seats=Array(12).fill(null);
 (data||[]).forEach(r=>{const extra=r.mode==='focus'&&r.state==='study'?Math.max(0,(now-Date.parse(r.state_at))/1000):0;
 seats[r.seat_no]={id:r.presence_id,nick:r.nick,subject:r.subject,look:r.look||{},mode:r.mode,state:r.state,elapsed:Math.floor((r.focus_acc||0)+extra)};});
 applySnapshot(key,seats);
}
function applySnapshot(k, snapshot){if(k!==roomKey)return;liveOccupied=snapshot.filter(Boolean).length;const seats=rooms[k].seats;
 snapshot.forEach((raw,i)=>{const s=seats[i],old=s.occ;if(!raw){if(old&&seatObjs[i]?.char)walkOut(i);s.occ=null;return}
 const mine=raw.id===liveId;const look={skin:SKIN[Math.max(0,Math.min(3,Number(raw.look.skin)||0))],hair:HAIR[Math.max(0,Math.min(4,Number(raw.look.hair)||0))],shirt:SHIRT[Math.max(0,Math.min(6,Number(raw.look.shirt)||0))],bun:raw.look.bun!==false};
 const fresh=!old||old.id!==raw.id;
 s.occ={...raw,mine,look};s.trace=null;
 if(mine&&pendingClaim&&pendingClaim.seat===i){pendingClaim=null;beginSitDown(i);}
 else if(fresh)placeChar(i,raw.state==='walk'?'enter':'sit',()=>{if(seats[i]?.occ?.state==='walk'){seats[i].occ.state='study';refreshLabels()}});
 if(mine&&me.seat===i&&me.subject!==raw.subject)me.subject=raw.subject;
 });
 if(me.seat!==null&&me.room===roomKey&&!pendingClaim&&!snapshot.some(s=>s&&s.id===liveId)&&!recoveryActive){
  // Never silently claim a new seat: a lost seat must be recovered by explicit user action.
  me.seat=null;me.room=null;me.state=null;clearHistoryTimer();$('#hud').classList.remove('show');sessionErr=true;toast('좌석이 반환됐습니다. 공부 이력은 서버에 남아 있어요.',5000);refreshTotals();
 }
 refreshLabels();renderGoal();renderStats();updateHud();
}

}

    checkOk(await rpc('sr6_state',{p_state:'study'}));await startHistory();}).catch(()=>{sessionErr=true;updateHud()});
  updateHud();refreshLabels();
 });$('#hud').classList.add('show');zoomTarget=.82;following=true;renderStats();updateHud();refreshLabels();
}
async function finishStudy(showReport=true){if(finishing||me.seat===null)return;const wasWalk=me.state==='walk';finishing=true;$('#hStop').disabled=true;
 try{if(!wasWalk&&!localSessionId){throw new Error('공부 기록을 아직 시작하지 못했어요. 연결 상태를 확인하고 다시 시도하세요.')}
  await queueTransition(async()=>{clearHistoryTimer();if(localSessionId&&['running','paused'].includes(localStatus))await histEvent('finish');
   checkOk(await rpc('sr6_release'));});
  const resultSeconds=me.elapsed;localSessionId=null;localStatus='idle';sessionErr=false;const i=me.seat;const s=rooms[roomKey].seats[i];if(s){s.occ=null;s.trace=null;if(seatObjs[i]?.char)walkOut(i)}
  me.seat=null;me.room=null;me.state=null;me.pausedAway=false;me.elapsed=0;zoomTarget=1;following=false;$('#hud').classList.remove('show');
  await refreshTotals();scheduleRefetch();renderStats();
  if(showReport){if(wasWalk)toast('공부 시작 전 자리를 취소했어요. 기록은 생성되지 않았습니다.');else showFinished(resultSeconds);}
 }catch(e){sessionErr=true;presentError(e);openSheet('<h3>기록 저장을 확인할 수 없어요</h3><p class="lead">서버 기록을 확인하지 못해 아직 자리를 정리하지 않았습니다. 다시 시도하거나 인터넷 연결을 확인하세요.</p><div class="acts"><button class="btn pri" data-a="retry">다시 마무리</button><button class="btn" data-a="close">닫기</button></div>','recording_error');$sheet.onclick=e=>{if(!e.target.closest('button'))return;const a=e.target.closest('button').dataset.a;closeSheet();if(a==='retry')finishStudy()}}
 finally{finishing=false;$('#hStop').disabled=false;}
}
function showFinished(s){openSheet(`<h3>🎉 공부를 마쳤어요</h3><p class="lead">이번 기록은 서버에 저장됐습니다. 같은 익명 계정이면 이 기기에서 계속 볼 수 있어요.</p><div class="rec"><span>이번 공부(화면 기준)</span><b>${fmtDuration(s)}</b></div><div class="rec"><span>오늘 집중 누적</span><b>${fmtDuration(getTodaySec('focus'))}</b></div><div class="rec"><span>오늘 자율 누적</span><b>${fmtDuration(getTodaySec('self'))}</b></div><div class="vstack"><button class="btn pri" data-a="record">나의 누적 기록 보기</button><button class="btn" data-a="close">닫기</button></div>`,'done');$sheet.onclick=e=>{const a=e.target.closest('button')?.dataset.a;closeSheet();if(a==='record')showMyRecord()}}
async function breakStudy(){if(me.seat===null||me.state!=='study')return;
 try{await queueTransition(async()=>{if(localSessionId&&localStatus==='running')await histEvent('pause');checkOk(await rpc('sr6_state',{p_state:'break'}));});
  me.state='break';me.breakLeft=300;updateHud();toast('5분 휴식 중입니다. 공부 시간은 누적되지 않아요.');
 }catch(e){sessionErr=true;presentError(e)}
}
async function resumeStudy(){if(me.seat===null||me.state!=='break')return;
 try{await queueTransition(async()=>{checkOk(await rpc('sr6_state',{p_state:'study'}));await startHistory()});me.state='study';me.pausedAway=false;lastTickT=performance.now();updateHud();toast('다시 공부를 시작해요');}
 catch(e){sessionErr=true;presentError(e)}
}
function syncForeground(){const active=studyWindowActive();if(active===foregroundActive)return;
 foregroundActive=active;lastTickT=performance.now();lastWallT=Date.now();
 if(!active&&me.seat!==null&&me.state==='study'&&me.mode==='focus'&&!me.pausedAway){me.pausedAway=true;clearHistoryTimer();
   queueTransition(async()=>{if(localSessionId&&localStatus==='running')await histEvent('pause');checkOk(await rpc('sr6_state',{p_state:'away'}))}).catch(()=>{sessionErr=true});updateHud();}
 else if(active&&me.seat!==null&&me.state==='study'&&me.mode==='focus'&&me.pausedAway){reenterFocus();}
}
function reenterFocus(){if(me.seat===null||me.mode!=='focus'||!studyWindowActive())return;
 queueTransition(async()=>{checkOk(await rpc('sr6_state',{p_state:'study'}));await startHistory();me.pausedAway=false;lastTickT=performance.now();updateHud()}).catch(()=>{sessionErr=true;updateHud()});
}
window.addEventListener('blur',syncForeground);window.addEventListener('focus',syncForeground);document.addEventListener('visibilitychange',syncForeground);
$('#hStop').addEventListener('click',()=>finishStudy());
$('#myRec').addEventListener('click',showMyRecord);
$('#roomBtn').addEventListener('click',showRoomPicker);
$('#goal').addEventListener('click',()=>showRoomPicker());
$('#schoolBtn').addEventListener('click',showSchoolPicker);
$('#breakBtn').addEventListener('click',()=>me.state==='break'?resumeStudy():breakStudy());

/* ---------- privacy, record, cheer ---------- */
async function showMyRecord(){if(!liveConnected){toast('기록은 접속 후 확인할 수 있어요');return}
 await Promise.all([refreshTotals(),fetchHistory()]);
 const row=(title,x)=>`<div class="rec"><span>${title}</span><b>${fmtDuration(x)}</b></div>`;
 const sessions=serverHistory.slice(0,10).map(r=>`<div class="rec"><span>${escapeHtml((r.started_at||'').slice(0,10))} · ${r.mode==='self'?'✍️ 자율':'🎯 집중'}<small>${escapeHtml(r.status||'')}</small></span><b>${fmtDuration(r.credited_seconds)}</b></div>`).join('');
 openSheet(`<h3>📊 나의 누적 공부 기록</h3><p class="lead">서버에 저장된 익명 계정의 공부 기록이에요. 실제 공부 여부는 스스로 판단해 주세요.</p>
 <div class="section-caption">오늘</div>${row('🎯 집중',serverTotals?.today?.focus_seconds)}${row('✍️ 자율 기록',serverTotals?.today?.self_seconds)}
 <div class="section-caption">최근 7일</div>${row('집중',serverTotals?.last_7_days?.focus_seconds)}${row('자율 기록',serverTotals?.last_7_days?.self_seconds)}
 <div class="section-caption">전체</div>${row('집중',getAllSec('focus'))}${row('자율 기록',getAllSec('self'))}
 <div class="section-caption">최근 공부</div>${sessions||'<p class="lead">아직 공부 기록이 없습니다.</p>'}
 <div class="record-notice"><b>${session?.user?.is_anonymous===false?'계정 연결됨':'익명 이용 중'}</b><p>${session?.user?.is_anonymous===false?'연결된 계정으로 다른 기기에서도 자신의 누적 기록을 불러올 수 있습니다.':'브라우저 데이터를 지우거나 다른 기기로 이동하면 같은 계정으로 돌아오지 못할 수 있어요. 구글 계정 연결은 인증 설정과 테스트를 마친 뒤 제공됩니다.'}</p></div>
 <div class="vstack"><button class="btn" data-a="rules">기록·개인정보 기준</button><button class="btn" data-a="close">닫기</button></div>`,'records');
 $sheet.onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(a==='close')closeSheet();if(a==='rules')showRules()};
}
function showRules(){openSheet(`<h3>기록과 개인정보 안내</h3><p class="lead">익명 인증 사용자 ID로 서버에 공부 시간과 날짜별 이력을 저장합니다.</p>
 <ul class="rules"><li><span>집중 모드</span><b>현재 창에서만</b></li><li><span>자율 기록</span><b>다른 창 이용도 가능</b></li><li><span>학교 선택</span><b>자기 신고 · 재학 검증 아님</b></li><li><span>학급 공식 기록</span><b>아직 미지원</b></li><li><span>계정 연결</span><b>추후 선택 제공</b></li></ul>
 <p class="note">실명·학번 입력을 요구하지 않지만, 익명 계정 식별자·선택 학교·공부 시간은 서버에 기록됩니다. 창 닫힘·인터넷 단절 중에는 일부 시간이 인정되지 않을 수 있습니다.</p><div class="acts"><button class="btn pri" data-a="close">확인</button></div>`,'rules');$sheet.onclick=e=>{if(e.target.closest('button'))closeSheet()}}
function showCheer(i){const o=rooms[roomKey].seats[i].occ;openSheet(`<h3>${escapeHtml(nameOf(o))}</h3><p class="lead">${escapeHtml(o.subject)} 공부 중 · 정해진 응원만 보낼 수 있어요</p><div class="cheers">${[['👏','힘내요'],['🔥','집중!'],['☕','쉬어가요']].map(([emoji,text])=>`<button class="btn" data-emoji="${emoji}"><span>${emoji}</span>${text}</button>`).join('')}</div>`,'cheer');
 $sheet.onclick=e=>{const emoji=e.target.closest('button')?.dataset.emoji;if(!emoji)return;closeSheet();if(Date.now()-lastCheerSent<5000){toast('응원은 5초에 한 번만 보내요');return}lastCheerSent=Date.now();roomChannel?.send({type:'broadcast',event:'cheer',payload:{seat:i,emoji}});floatEmoji(i,emoji)};
}

/* ---------- single-tab safety ---------- */
const tabId=id4(), bc=('BroadcastChannel' in window)?new BroadcastChannel('sr6b_tabs'):null;
if(bc)bc.onmessage=e=>{const p=e.data||{};if(p.t==='who'&&activeTab)bc.postMessage({t:'here',to:p.from});
 if(p.t==='here'&&p.to===tabId&&tabWaiting){tabWaiting=false;openSheet('<h3>다른 탭에서 열려 있어요</h3><p class="lead">같은 계정의 열람실을 한 탭에서만 사용하세요. 옮기면 기존 탭의 공부가 중단될 수 있습니다.</p><div class="vstack"><button class="btn pri" data-a="take">이 탭으로 옮기기</button><button class="btn" data-a="stay">그대로 두기</button></div>','tab');$sheet.onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;closeSheet();if(a==='take'){bc.postMessage({t:'yield',from:tabId});setTimeout(()=>{activeTab=true;connect()},350)}}}
 if(p.t==='yield'&&p.from!==tabId){activeTab=false;liveConnected=false;clearInterval(hbTimer);clearHistoryTimer();if(roomChannel){sb?.removeChannel(roomChannel);roomChannel=null}renderStats();toast('다른 탭에서 이어서 사용 중입니다.',5000)}
};
function startLive(){if(!bc){activeTab=true;connect();return}tabWaiting=true;bc.postMessage({t:'who',from:tabId});setTimeout(()=>{if(tabWaiting){tabWaiting=false;activeTab=true;connect()}},450)}
addEventListener('pagehide',()=>{clearHistoryTimer();clearInterval(hbTimer);/* Do not send unauthenticated keepalive RPCs or imply server success. */});

/* ---------- clock ---------- */
function tick(){const now=performance.now(),step=Math.min(2,Math.max(0,(now-lastTickT)/1000));lastTickT=now;
 if(me.seat!==null&&liveConnected){if(me.state==='study'&&!sessionErr&&localStatus==='running'&&(me.mode==='self'||studyWindowActive())&&!me.pausedAway){
  me.elapsed+=step;if(me.elapsed>=me.len&&!finishing){finishStudy();}
 }else if(me.state==='break'){
  me.breakLeft=Math.max(0,me.breakLeft-step);if(me.breakLeft<=0)resumeStudy();
 }updateHud();}
 for(const s of rooms[roomKey].seats){if(s.occ&&!s.occ.mine&&s.occ.state==='study')s.occ.elapsed=(s.occ.elapsed||0)+step}
 refreshLabels();
}
setInterval(()=>{syncForeground();tick()},1000);

/* ---------- start ---------- */
$('#dday').innerHTML='시험판<i>v0.6-B</i>';
$('#conn').textContent='익명 인증 준비…';
window.__sr={empty:()=>{const a=[];rooms[roomKey].seats.forEach((s,i)=>{if(s.occ)return;const so=seatObjs[i];v3.set(so.x,.9,so.z).project(camera);a.push([(v3.x*.5+.5)*innerWidth,(-v3.y*.5+.5)*innerHeight])});return a},version:'0.6-B-test'};
function initialUI(){buildRoom();renderRoomButton();renderGoal();renderStats();$('#loading')?.remove();startLive();requestAnimationFrame(frame)}
initialUI();

/* ---------- loop ---------- */
function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;if(d<-Math.PI)d+=Math.PI*2;return a+d*t}
function animChar(c,dt,brk){ // returns true when it should be removed
  const u=c.userData,p=u.parts;const ph=(u.phase+=dt);
  if(u.pop<1&&!u.vanish){u.pop=Math.min(1,u.pop+dt*2.5);const e=1+Math.sin(u.pop*Math.PI)*.18;c.scale.setScalar(Math.max(.001,u.pop*e))}
  if(u.vanish){u.pop-=dt*2.5;c.scale.setScalar(Math.max(.001,u.pop));return u.pop<=0}
  if(u.path&&u.path.length){
    const [tx,tz]=u.path[0];const dx=tx-c.position.x,dz=tz-c.position.z,d=Math.hypot(dx,dz),st=WALK*dt;
    if(d>.001)c.rotation.y=lerpAng(c.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*12));
    if(d<=st){c.position.x=tx;c.position.z=tz;u.path.shift();
      if(!u.path.length){
        if(u.exiting){u.vanish=true}else{u.seated=true;const f=u.onArrive;u.onArrive=null;f&&f()}
      }}
    else{c.position.x+=dx/d*st;c.position.z+=dz/d*st}
    const sw=Math.sin(ph*11);
    p.lL.rotation.x=sw*.6;p.lR.rotation.x=-sw*.6;
    p.lA.rotation.x=-sw*.5;p.rA.rotation.x=sw*.5;p.lA.rotation.z=.12;p.rA.rotation.z=-.12;
    p.head.rotation.x=0;p.head.rotation.z=0;
    c.position.y=Math.abs(Math.cos(ph*11))*.05;
    return false;
  }
  c.position.y+=(0-c.position.y)*.3;
  if(u.seated){
    c.rotation.y=lerpAng(c.rotation.y,0,Math.min(1,dt*10));
    p.lL.rotation.x+=(-1.5-p.lL.rotation.x)*.2;p.lR.rotation.x+=(-1.5-p.lR.rotation.x)*.2;
  }
  if(brk){
    p.rA.rotation.x+=((-2.7)-p.rA.rotation.x)*.08;p.lA.rotation.x+=((-2.7)-p.lA.rotation.x)*.08;
    p.head.rotation.z=Math.sin(ph*1.2)*.12;p.head.rotation.x=-.15;
  }else{
    p.rA.rotation.x+=((-1.15+Math.sin(ph*9)*.05)-p.rA.rotation.x)*.2;
    p.rA.rotation.z=-.25+Math.sin(ph*7)*.06;
    p.lA.rotation.x+=((-1.05)-p.lA.rotation.x)*.1;p.lA.rotation.z=.25;
    p.head.rotation.x=.1+Math.sin(ph*.8)*.04;p.head.rotation.z=Math.sin(ph*.5)*.05;
    p.body.rotation.z=Math.sin(ph*.7)*.02;
  }
  if(u.ring)u.ring.material.opacity=.55+Math.sin(ph*3)*.3;
  return false;
}
let last=performance.now();
function frame(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  updateCamera(dt);
  seatObjs.forEach((so,i)=>{
    const c=so.char;if(!c)return;
    const seat=rooms[roomKey].seats[i];
    animChar(c,dt,seat.occ&&seat.occ.state==='break');
  });
  for(let k=walkers.length-1;k>=0;k--){const c=walkers[k];if(animChar(c,dt,false)){roomGroup.remove(c);walkers.splice(k,1)}}
  if(following&&me.seat!==null){const so=seatObjs[me.seat];if(so&&so.char){const r=camRange();camZTarget=Math.min(r[1],Math.max(r[0],so.char.position.z+.9))}}
  plants.forEach(p=>{const s=p.scale.x;const tg=Math.max(.001,p.userData.target);if(Math.abs(s-tg)>.002)p.scale.setScalar(s+(tg-s)*.06)});
  renderer.render(scene,camera);
  positionLabels();
  requestAnimationFrame(frame);
}

let lastPortrait=null;
addEventListener('resize',()=>{
  const p=innerWidth/innerHeight<.85;
  if(p!==lastPortrait&&me.seat===null){lastPortrait=p;buildRoom()}else fitCamera(false);
});

})();
