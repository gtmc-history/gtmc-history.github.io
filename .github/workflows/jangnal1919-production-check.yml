name: jangnal1919 hub production check

on:
  push:
    branches:
      - feat/jangnal1919
    paths:
      - '.github/workflows/jangnal1919-production-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jangnal1919
      - name: Check public hub projection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gtmc-history.github.io/ -o /tmp/home.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gtmc-history.github.io/data/games.json -o /tmp/games.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gtmc-history.github.io/dashboard/ -o /tmp/dashboard.html
          node -e "const d=require('/tmp/games.json'); const g=d.games.find(x=>x.slug==='jangnal1919'); if(!g||g.path!=='/games/jangnal1919/'||g.status!=='published') process.exit(1); console.log(g.title, g.path, g.status);"
      - name: Remove one-time production check
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/jangnal1919-production-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove jangnal1919 hub production check'
          git push origin HEAD:feat/jangnal1919
