name: One-time imjeong1919 hub release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imjeong1919-release.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate hub metadata and dashboard renderer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const gamesPath = 'data/games.json';
          const data = JSON.parse(fs.readFileSync(gamesPath, 'utf8'));
          if (!data.games.some(g => g.slug === 'imjeong1919')) {
            for (const g of data.games) {
              if (Number.isFinite(g.sortOrder) && g.sortOrder >= 28) g.sortOrder += 1;
            }
            data.games.push({
              id: 'G034',
              legacyOrder: 34,
              sortOrder: 28,
              slug: 'imjeong1919',
              title: '1919~1925, 임시 정부를 다시 설계하다',
              shortDescription: '수업에서 배운 임시 정부의 운영과 위기를 자료로 다시 판단하며 1919~1925년 자신의 판단 변화를 확인한다.',
              course: '한국사2',
              era: '일제강점기',
              unit: '대한민국 임시 정부의 수립과 활동',
              periodLabel: '대한민국 임시 정부 · 1919–1925',
              startYear: 1919,
              endYear: 1925,
              lessonUse: ['정리'],
              activityType: '자료·판단',
              durationMin: 18,
              durationMax: 22,
              participation: '개인',
              tags: ['대한민국 임시 정부', '자료 판단', '판단 궤적'],
              learningGoal: '대한민국 임시 정부가 위기 속에서 운영 방식과 우선순위를 어떻게 재검토했는지 자료를 근거로 설명하고 자신의 판단 변화를 성찰한다.',
              essentialQuestion: '독립운동의 구심점으로 만들어진 임시 정부는 위기가 닥칠 때 무엇을 유지하고 무엇을 바꾸어야 했을까?',
              ai: { use: 'none', mode: null },
              path: '/games/imjeong1919/',
              status: 'published',
              dataCollection: { status: 'audit_required' },
              dashboard: { status: 'audit_required' }
            });
            data.games.sort((a,b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));
            fs.writeFileSync(gamesPath, JSON.stringify(data, null, 2) + '\n');
          }

          const dashPath = 'dashboard/index.html';
          let html = fs.readFileSync(dashPath, 'utf8');
          if (!html.includes("game_id: 'imjeong1919'")) {
            const fallbackMarker = "  rationnet1943: {\n";
            const fallback = "  imjeong1919: {\n    game_id: 'imjeong1919',\n    label: '1919~1925, 임시 정부를 다시 설계하다',\n    era: '일제강점기 · 대한민국 임시 정부',\n    axes: [], scenes: [], sliders: [], endings: [],\n  },\n";
            if (!html.includes(fallbackMarker)) throw new Error('fallback marker not found');
            html = html.replace(fallbackMarker, fallback + fallbackMarker);
          }
          if (!html.includes("imjeong1919: '1919~1925, 임시 정부를 다시 설계하다'")) {
            const labelMarker = "  jangnal1919: '장날, 1919년 3월',\n";
            if (!html.includes(labelMarker)) throw new Error('label marker not found');
            html = html.replace(labelMarker, labelMarker + "  imjeong1919: '1919~1925, 임시 정부를 다시 설계하다',\n");
          }
          if (!html.includes('imjeong1919: buildImjeongCards')) {
            const rendererMarker = "  jangnal1919: buildJangnalCards,\n";
            if (!html.includes(rendererMarker)) throw new Error('renderer marker not found');
            html = html.replace(rendererMarker, rendererMarker + "  imjeong1919: buildImjeongCards,\n");
          }
          if (!html.includes('const IMJEONG_S3')) {
            const insertMarker = "// 1919, 무엇이 달라졌나 — choices: {final_axis, changed_by, r1..r4}\n";
            const code = `// 1919~1925, 임시 정부를 다시 설계하다 — 수업 후 판단 궤적\nconst IMJEONG_S3 = {\n  '연결': { label: '국내 연결', color: 'c-blue' },\n  '자금': { label: '자금', color: 'c-amber' },\n  '외교': { label: '외교', color: 'c-jade' },\n  '합의': { label: '노선 합의', color: 'c-red' },\n};\nconst IMJEONG_TRANSITION = {\n  '유지': { label: '같은 우선순위 유지', color: 'c-blue' },\n  '전환': { label: '다른 우선순위로 전환', color: 'c-amber' },\n  '진입': { label: '합의 → 운영 기반으로 이동', color: 'c-jade' },\n  '이탈': { label: '운영 기반 → 합의로 이동', color: 'c-red' },\n  '비해당': { label: '노선 합의 유지', color: 'c-muted' },\n};\nconst IMJEONG_S5 = {\n  '개조': { label: '개조', color: 'c-jade' },\n  '창조': { label: '창조', color: 'c-red' },\n  '고수': { label: '회의 결정 불인정·정부 고수', color: 'c-blue' },\n};\nconst IMJEONG_S6 = {\n  '찬성': { label: '탄핵 찬성', color: 'c-red' },\n  '반대': { label: '탄핵 반대', color: 'c-blue' },\n  '유보': { label: '자료 부족·판단 유보', color: 'c-muted' },\n};\nconst IMJEONG_S4_REASON = {\n  '연락망 붕괴': { label: '연락망 붕괴', color: 'c-blue' },\n  '외교 성과 부족': { label: '외교 성과 부족', color: 'c-jade' },\n  '노선 갈등': { label: '노선 갈등', color: 'c-amber' },\n  '청원 성토': { label: '위임 통치 청원 성토', color: 'c-red' },\n};\nfunction buildImjeongCards(rows, meta) {\n  const resultRows = rows.filter(row => {\n    const c = row?.choices || {};\n    return c.record_type !== 'comment' && (c.record_type === 'result' || c.s1_integration_plan);\n  });\n  const label = meta.label || '1919~1925, 임시 정부를 다시 설계하다';\n  const s3Rows = resultRows.map(row => ({ ...row, choices: { ...row.choices, imj_s3: row.choices?.s3_priority || (row.choices?.s3_org_stance ? '합의' : '') } }));\n  const s4Rows = resultRows.map(row => ({ ...row, choices: { ...row.choices, imj_s4: row.choices?.s4_priority || (row.choices?.s4_org_stance ? '합의' : '') } }));\n  return [\n    buildChoiceBars(label, '1920년 · 가장 놓쳐서는 안 될 기반', s3Rows, 'imj_s3', IMJEONG_S3),\n    buildChoiceBars(label, '1921년 위기 이후 · 다시 고른 기반', s4Rows, 'imj_s4', IMJEONG_S3),\n    buildChoiceBars(label, '1920 → 1921 · 판단 변화', resultRows, 'priority_transition', IMJEONG_TRANSITION),\n    buildChoiceBars(label, '판단을 가장 흔든 사건', resultRows, 's4_reason_event', IMJEONG_S4_REASON),\n    buildChoiceBars(label, '1923년 · 임시 정부 문제에 대한 입장', resultRows, 's5_stance', IMJEONG_S5),\n    buildChoiceBars(label, '1925년 · 탄핵 책임 판단', resultRows, 's6_verdict', IMJEONG_S6),\n  ];\n}\n\n`;
            if (!html.includes(insertMarker)) throw new Error('custom renderer insertion marker not found');
            html = html.replace(insertMarker, code + insertMarker);
          }
          fs.writeFileSync(dashPath, html);
          NODE
      - name: Commit integration
        run: |
          git config user.name 'gtmc-history'
          git config user.email '223800573+gtmc-history@users.noreply.github.com'
          git add data/games.json dashboard/index.html
          if git diff --cached --quiet; then
            echo 'No integration changes needed.'
          else
            git commit -m 'feat: publish imjeong1919 in hub and dashboard'
            git push
          fi
