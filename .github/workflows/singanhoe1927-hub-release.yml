name: Singanhoe hub release

on:
  push:
    branches:
      - release/singanhoe1927-hub

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub repository
        uses: actions/checkout@v4
        with:
          ref: release/singanhoe1927-hub

      - name: Add Singanhoe hub and dashboard metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          games_path = Path('data/games.json')
          data = json.loads(games_path.read_text(encoding='utf-8-sig'))
          games = data['games']
          if not any(g.get('slug') == 'singanhoe1927' for g in games):
              if any(g.get('id') == 'G037' for g in games):
                  raise SystemExit('G037 already exists; choose a new hub display id before publishing')
              games.append({
                  'id': 'G037',
                  'legacyOrder': 37,
                  'sortOrder': 29.75,
                  'slug': 'singanhoe1927',
                  'title': '지회의 4년',
                  'shortDescription': '1927년에 세운 기준을 기록해 두고 1931년 해소 논쟁까지 자료를 다시 꺼내며 자신의 판단 변화를 추적한다.',
                  'course': '한국사2',
                  'era': '일제강점기',
                  'unit': '신간회의 결성과 활동',
                  'periodLabel': '신간회 · 1927–1931',
                  'startYear': 1927,
                  'endYear': 1931,
                  'lessonUse': ['정리'],
                  'activityType': '자료·판단',
                  'durationMin': 20,
                  'durationMax': 22,
                  'participation': '개인',
                  'tags': ['신간회', '사료 판단', '판단 궤적'],
                  'learningGoal': '신간회의 결성과 활동, 해소 논쟁을 당시 공개된 자료와 자신의 이전 판단을 연결해 설명하고 역사적 판단의 변화를 성찰한다.',
                  'essentialQuestion': '서로 다른 세력이 함께 만든 신간회는 어떤 조건에서 연대했고, 왜 해소를 둘러싼 논쟁에 이르렀을까?',
                  'ai': {'use': 'none', 'mode': None},
                  'path': '/games/singanhoe1927/',
                  'status': 'published',
                  'dataCollection': {'status': 'audit_required'},
                  'dashboard': {'status': 'audit_required'}
              })
          games_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          dash_path = Path('dashboard/index.html')
          dash = dash_path.read_text(encoding='utf-8')

          if "game_id: 'singanhoe1927'" not in dash:
              marker = "\n};\n\nconst GAME_ID_ALIASES = {"
              start = dash.index('const FALLBACK_META = {')
              insert_at = dash.index(marker, start)
              fallback = "\n  singanhoe1927: {\n    game_id: 'singanhoe1927',\n    label: '지회의 4년',\n    era: '일제강점기 · 신간회 1927~1931',\n    axes: [], scenes: [], sliders: [], endings: [],\n  },"
              dash = dash[:insert_at] + fallback + dash[insert_at:]

          if "singanhoe1927: '지회의 4년'" not in dash:
              marker = "  newsroom1945: '1945 NEWSROOM',\n"
              if marker not in dash:
                  raise SystemExit('CANONICAL_GAME_LABELS insertion marker not found')
              dash = dash.replace(marker, marker + "  singanhoe1927: '지회의 4년',\n", 1)

          dash_path.write_text(dash, encoding='utf-8')

          workflow = Path('.github/workflows/singanhoe1927-hub-release.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          python -m json.tool data/games.json >/dev/null
          grep -q "singanhoe1927" data/games.json
          grep -q "singanhoe1927: '지회의 4년'" dashboard/index.html
          git diff --check

      - name: Commit generated hub release
        shell: bash
        run: |
          git config user.name "gtmc-history"
          git config user.email "223800573+gtmc-history@users.noreply.github.com"
          git add -A
          git commit -m "Publish singanhoe1927 to hub and dashboard"
          git push origin HEAD:release/singanhoe1927-hub
