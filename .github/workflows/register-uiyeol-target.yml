name: Register uiyeol-target in hub

on:
  push:
    paths:
      - '.hub-register-uiyeol-target'

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hub projection and dashboard label
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const gamePath = 'data/games.json';
          const data = JSON.parse(fs.readFileSync(gamePath, 'utf8').replace(/^\uFEFF/, ''));
          const slug = 'uiyeol-target';
          const entry = {
            id: 'G035',
            legacyOrder: 35,
            sortOrder: 29,
            slug,
            title: '왜 그곳을 겨냥했을까?',
            shortDescription: '의열 투쟁의 표적을 분류하고 사료와 실행 결과를 비교하며 표적만으로 조직·전략·논리를 어디까지 설명할 수 있는지 판단한다.',
            course: '한국사2',
            era: '일제강점기',
            unit: '무장 투쟁과 의열 투쟁',
            periodLabel: '1919–1932 · 의열 투쟁',
            startYear: 1919,
            endYear: 1932,
            lessonUse: [],
            lessonUseStatus: 'unconfirmed',
            activityType: '자료·판단',
            durationMin: null,
            durationMax: null,
            durationStatus: 'unconfirmed',
            participation: '개인',
            tags: ['의열 투쟁', '사료 비판', '표적 분류'],
            learningGoal: '의열 투쟁의 주요 사례를 표적의 성격에 따라 분류하고, 사료와 실행 결과를 근거로 표적이 보여 주는 의도와 설명의 한계를 판단한다.',
            essentialQuestion: '표적을 보면 독립운동가들이 식민 지배의 무엇을 문제로 보았는지 어디까지 읽을 수 있을까?',
            ai: { use: 'none', mode: null },
            path: '/games/uiyeol-target/',
            status: 'published',
            dataCollection: { status: 'audit_required' },
            dashboard: { status: 'audit_required' }
          };
          const existingIndex = data.games.findIndex(g => g.slug === slug);
          if (existingIndex < 0) {
            for (const g of data.games) {
              if (Number.isFinite(g.sortOrder) && g.sortOrder >= entry.sortOrder) g.sortOrder += 1;
            }
            data.games.push(entry);
          } else {
            const preserved = data.games[existingIndex];
            data.games[existingIndex] = { ...preserved, ...entry };
          }
          if (data.source) data.source.checkedDate = '2026-09-08';
          fs.writeFileSync(gamePath, JSON.stringify(data, null, 2) + '\n');

          const dashPath = 'dashboard/index.html';
          let dash = fs.readFileSync(dashPath, 'utf8');
          if (!dash.includes("uiyeol-target: '왜 그곳을 겨냥했을까?'")) {
            const start = dash.indexOf('const CANONICAL_GAME_LABELS = {');
            const end = dash.indexOf('\n};', start);
            if (start < 0 || end < 0) throw new Error('CANONICAL_GAME_LABELS block not found');
            dash = dash.slice(0, end) + "\n  'uiyeol-target': '왜 그곳을 겨냥했을까?'," + dash.slice(end);
            fs.writeFileSync(dashPath, dash);
          }
          NODE
      - name: Cross-repo audit
        shell: bash
        run: |
          git clone --depth 1 https://github.com/gtmc-history/games.git ../games
          cd ../games
          npm run audit:games -- --hub-repo "$GITHUB_WORKSPACE"
      - name: Commit hub publication
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json dashboard/index.html
          if git diff --cached --quiet; then
            echo 'No hub changes needed.'
            exit 0
          fi
          git diff --check
          git commit -m 'publish uiyeol-target in hub and dashboard'
          git push
