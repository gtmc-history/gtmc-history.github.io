name: Integrate jangnal1919 hub projection

on:
  push:
    branches:
      - feat/jangnal1919
    paths:
      - '.github/workflows/integrate-jangnal1919.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jangnal1919
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch hub projection and dashboard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const dataPath = 'data/games.json';
          const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
          if (!Array.isArray(data.games)) throw new Error('data/games.json games array missing');
          if (!data.games.some(g => g.slug === 'jangnal1919')) {
            const after = data.games.findIndex(g => g.slug === 'hoesaryeong1912');
            if (after < 0) throw new Error('hoesaryeong1912 anchor missing');
            for (const game of data.games) {
              if (Number.isFinite(game.sortOrder) && game.sortOrder >= 26) game.sortOrder += 1;
            }
            const maxId = Math.max(...data.games.map(g => Number(String(g.id || '').replace(/^G/, '')) || 0));
            const maxLegacy = Math.max(...data.games.map(g => Number(g.legacyOrder) || 0));
            data.games.splice(after + 1, 0, {
              id: `G${String(maxId + 1).padStart(3, '0')}`,
              legacyOrder: maxLegacy + 1,
              sortOrder: 26,
              slug: 'jangnal1919',
              title: '장날, 1919년 3월',
              shortDescription: '1919년 3월의 지역 주민이 되어 소식·준비·시점·공간을 판단하고 실제 광주군 기록과 대조한다.',
              course: '한국사2',
              era: '일제강점기',
              unit: '3·1 운동과 지역 사회의 참여',
              periodLabel: '3·1 운동 · 1919년 3월',
              startYear: 1919,
              endYear: 1919,
              lessonUse: ['전개', '정리'],
              activityType: '선택·판단',
              durationMin: 15,
              durationMax: 20,
              participation: '개인',
              tags: ['3·1 운동', '지역사', '역사적 판단'],
              learningGoal: '3·1 운동이 지역에서 장날·마을·면사무소 같은 공간과 관계망을 통해 다시 조직되었음을 실제 기록과 비교하여 설명한다.',
              essentialQuestion: '전국적 만세 운동은 지역에서 어떤 판단과 관계망을 통해 다시 조직되었는가?',
              ai: { use: 'none', mode: null },
              path: '/games/jangnal1919/',
              status: 'published',
              dataCollection: { status: 'audit_required' },
              dashboard: { status: 'audit_required' }
            });
          }
          fs.writeFileSync(dataPath, JSON.stringify(data, null, 2) + '\n');

          const dashPath = 'dashboard/index.html';
          let dash = fs.readFileSync(dashPath, 'utf8');

          if (!dash.includes("game_id: 'jangnal1919'")) {
            const anchor = `  hoesaryeong1912: {\n    game_id: 'hoesaryeong1912',\n    label: '허가받으시오 — 1912년, 회사를 세우다',\n    era: '일제강점기 · 1910년대',\n    axes: [], scenes: [], sliders: [], endings: [],\n  },\n`;
            if (!dash.includes(anchor)) throw new Error('FALLBACK_META anchor missing');
            dash = dash.replace(anchor, anchor + `  jangnal1919: {\n    game_id: 'jangnal1919',\n    label: '장날, 1919년 3월',\n    era: '일제강점기 · 3·1 운동',\n    axes: [], scenes: [], sliders: [], endings: [],\n  },\n`);
          }

          if (!dash.includes("  jangnal1919: '장날, 1919년 3월',")) {
            const anchor = "  hoesaryeong1912: '허가받으시오 — 1912년, 회사를 세우다',\n";
            if (!dash.includes(anchor)) throw new Error('CANONICAL_GAME_LABELS anchor missing');
            dash = dash.replace(anchor, anchor + "  jangnal1919: '장날, 1919년 3월',\n");
          }

          if (!dash.includes('  jangnal1919: buildJangnalCards,')) {
            const anchor = '  hoesaryeong1912: buildHoesaryeongCards,\n';
            if (!dash.includes(anchor)) throw new Error('CUSTOM_RENDERERS anchor missing');
            dash = dash.replace(anchor, anchor + '  jangnal1919: buildJangnalCards,\n');
          }

          if (!dash.includes('const JANGNAL_S1 = {')) {
            const marker = '// 1919, 무엇이 달라졌나 — choices: {final_axis, changed_by, r1..r4}';
            if (!dash.includes(marker)) throw new Error('renderer insertion marker missing');
            const renderer = `// 장날, 1919년 3월 — 선택의 옳고 그름이 아니라 판단 분포만 표시\nconst JANGNAL_S1 = {\n  village: { label: '동리 어른들에게', color: 'c-jade' },\n  market: { label: '장터의 상인·장꾼에게', color: 'c-blue' },\n  myeonjang: { label: '면장에게', color: 'c-amber' },\n  wait: { label: '아직 아무에게도', color: 'c-muted' },\n};\nconst JANGNAL_S3 = {\n  tonight: { label: '오늘 밤 · 마을', color: 'c-red' },\n  marketday: { label: '내일 장날 · 장터', color: 'c-blue' },\n  joint: { label: '이웃 면에도 알림', color: 'c-jade' },\n  avoid: { label: '장날을 피함', color: 'c-muted' },\n};\nconst JANGNAL_S4 = {\n  office: { label: '면사무소 앞', color: 'c-red' },\n  myeonjang_home: { label: '면장의 집', color: 'c-amber' },\n  market: { label: '장터로 돌아감', color: 'c-blue' },\n  disperse: { label: '해산', color: 'c-muted' },\n};\n\nfunction buildJangnalCards(rows, meta) {\n  const resultRows = rows.filter(row => row.choices?.s1_inform || row.choices?.s4_where);\n  const label = meta.label || '장날, 1919년 3월';\n  return [\n    buildChoiceBars(label, '서울 소식을 누구에게 먼저 알렸는가', resultRows, 's1_inform', JANGNAL_S1),\n    buildChoiceBars(label, '언제·어디서 모이려 했는가', resultRows, 's3_when', JANGNAL_S3),\n    buildChoiceBars(label, '면사무소 앞에서 어디로 갔는가', resultRows, 's4_where', JANGNAL_S4),\n  ];\n}\n\n`;
            dash = dash.replace(marker, renderer + marker);
          }

          fs.writeFileSync(dashPath, dash);

          const check = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
          const game = check.games.find(g => g.slug === 'jangnal1919');
          if (!game || game.title !== '장날, 1919년 3월' || game.path !== '/games/jangnal1919/' || game.status !== 'published') {
            throw new Error('hub projection verification failed');
          }
          const finalDash = fs.readFileSync(dashPath, 'utf8');
          for (const token of [
            "game_id: 'jangnal1919'",
            "jangnal1919: '장날, 1919년 3월'",
            'jangnal1919: buildJangnalCards',
            'function buildJangnalCards(rows, meta)'
          ]) if (!finalDash.includes(token)) throw new Error(`dashboard token missing: ${token}`);
          NODE
      - name: Commit projection and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/integrate-jangnal1919.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hub: add jangnal1919 projection and dashboard renderer'
          git push origin HEAD:feat/jangnal1919
