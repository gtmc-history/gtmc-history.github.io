<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>[CLASSROOM PREVIEW] STUDY ROOM 30석 · 4면 도서관·캐릭터 시점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2c1e; --muted:#7d6a55; --paper:#fbf6ea; --paper2:#f3ead6;
  --green:#2f9b6c; --green2:#e3f6ec; --amber:#e39b2d; --line:#e4d7bd;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2118;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.jua{font-family:'Jua',sans-serif;font-weight:400}

/* top */
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;pointer-events:none;
  background:linear-gradient(#2b2118ee 55%,#2b211800)}
.top *{pointer-events:auto}
.row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{color:#fff6e3;font-family:'Jua';font-size:20px;letter-spacing:.3px;line-height:1}
.brand small{display:block;font-family:'Gowun Dodum';font-size:11px;color:#d9c7a6;margin-top:3px;letter-spacing:0}
.dday{background:#ffe7a8;color:#5a3a10;border-radius:999px;padding:5px 10px;font-family:'Jua';font-size:14px;white-space:nowrap}
.dday i{font-style:normal;font-family:'Gowun Dodum';font-size:10px;opacity:.7;margin-left:3px}
.tabs{display:flex;gap:6px;margin-top:10px;background:#00000040;padding:4px;border-radius:14px}
.tab{flex:1;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:#e9dcc3;font-family:'Jua';font-size:14px;cursor:pointer}
.tab.on{background:var(--paper);color:var(--ink)}
.stats{display:flex;gap:10px;margin-top:8px;color:#efe3cc;font-size:12px;align-items:center}
.stats b{font-family:'Jua';font-weight:400;font-size:15px;color:#fff}
.mock{background:#ffffff1f;border-radius:99px;padding:2px 7px;font-size:10px;color:#e9dcc3}
.dot{width:7px;height:7px;border-radius:50%;background:#57e39b;box-shadow:0 0 0 3px #57e39b33;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #57e39b11}}

/* goal */
.goal{margin-top:8px;background:#fbf6eaee;border-radius:14px;padding:9px 11px;box-shadow:0 4px 14px #0003;cursor:pointer}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.goal .gt b{font-family:'Jua';font-weight:400;font-size:15px;color:var(--ink)}
.bar{height:9px;background:var(--paper2);border-radius:99px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#45c487,#2f9b6c);border-radius:99px;transition:width .6s}
.goal .gs{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.goal .gs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* labels */
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fffaf0ee;border-radius:12px;padding:3px 8px 4px;
  text-align:center;white-space:nowrap;box-shadow:0 2px 6px #0003;line-height:1.25;will-change:transform}
.bub .n{font-size:10px;color:var(--muted)}
.bub .s{font-size:12px;font-family:'Jua'}
.bub.brk{background:#fff1d6ee}
.bub.me{background:#e3f6ecf2;outline:2px solid var(--green)}
.bub:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#fffaf0ee}
.bub.me:after{border-top-color:var(--green)}
.trace{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:#1d150e99;color:#f3e6cf;font-size:10px;border-radius:99px;padding:2px 7px;white-space:nowrap}
.emo{position:absolute;font-size:26px;transform:translate(-50%,-100%);animation:fly 1.8s ease-out forwards}
@keyframes fly{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-70px;scale:1}}

/* hint & bottom chips */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 52px);background:#fbf6eaf0;padding:8px 14px;border-radius:99px;
  font-size:13px;box-shadow:0 4px 14px #0004;white-space:nowrap;transition:opacity .3s}
.foot{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 10px);display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;border:0;background:#00000066;color:#f0e2c8;font-size:11px;border-radius:99px;padding:7px 11px;font-family:inherit;cursor:pointer}
.chip b{color:#fff}
.chip.fast{background:var(--amber);color:#3a2205}

/* hud */
.hud{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 48px);background:var(--paper);border-radius:20px;padding:12px 14px;box-shadow:0 8px 28px #0006;
  display:none;max-width:480px;margin:0 auto}
.hud.show{display:block;animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.hud .h1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{background:var(--green2);color:#1f6e4b;border-radius:99px;padding:3px 10px;font-size:12px;font-family:'Jua'}
.time{font-family:'Jua';font-size:40px;line-height:1;letter-spacing:1px}
.hud .h2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted);gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-family:'Jua';font-size:15px;cursor:pointer;background:var(--paper2);color:var(--ink)}
.btn.pri{background:var(--green);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:active{transform:scale(.97)}

/* sheet */
.dim{position:fixed;inset:0;background:#0006;display:none}
.dim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 16px);
  max-height:84vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;max-width:520px;margin:0 auto;box-shadow:0 -6px 30px #0005}
.sheet.show{transform:none}
.sheet h3{margin:2px 0 4px;font-family:'Jua';font-weight:400;font-size:21px}
.sheet .lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.fld{margin:12px 0}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--green);background:var(--green2);color:#1f6e4b;font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--green)}
.nick{display:flex;align-items:center;gap:8px}
.nick .nv{font-family:'Jua';font-size:20px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.note{font-size:11px;color:var(--muted);margin-top:5px}
.tog{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.tog input{width:44px;height:24px;accent-color:var(--green)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.vstack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.big{font-size:44px;text-align:center;margin:6px 0 2px}
.rec{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;margin-top:6px}
.rec b{font-family:'Jua';font-weight:400;font-size:16px}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.rules li b{font-family:'Jua';font-weight:400}
.cheers{display:flex;gap:8px;margin-top:10px}
.cheers .btn{flex:1;font-size:14px;padding:12px 4px}
.cheers .btn span{display:block;font-size:24px}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-140%);background:#2f2419f2;color:#fff6e3;padding:10px 16px;border-radius:14px;font-size:13px;
  box-shadow:0 6px 20px #0006;transition:transform .3s;max-width:90vw;text-align:center;z-index:9}
.toast.show{transform:translate(-50%,0)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e9dcc3;font-family:'Jua';font-size:18px}
@media (min-width:760px){.top{padding-left:20px;padding-right:20px}.top .wrap{max-width:520px}}

.school-choice{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.school-choice small,.rec small{display:block;color:var(--muted);font:12px 'Gowun Dodum',sans-serif}
.section-caption{font-family:'Jua';font-size:15px;color:var(--green);margin:13px 0 6px}
.record-notice{background:#f5ecd5;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.record-notice p{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.6}
#schoolSearch:focus{outline:2px solid var(--green)}
#hMsg{max-width:55%;line-height:1.3}
@media(max-width:370px){.brand{font-size:16px}.chip{font-size:10px;padding:6px 8px}.h2{font-size:10px!important}}
</style>
<style>#sr-stage-label{position:fixed;right:12px;top:12px;z-index:999999;background:#1f2937;color:#fff;font:600 11px/1.4 system-ui,sans-serif;padding:6px 9px;border-radius:7px;pointer-events:none;opacity:.92}</style>
<style>
/* Isolated design-preview camera controls. Never obstruct the study record modal. */
#view6d{position:fixed;right:10px;top:calc(var(--st) + 215px);z-index:6;display:flex;flex-direction:column;gap:5px;align-items:flex-end;max-width:145px}
#view6d .view-row{display:flex;gap:4px;align-items:center}
#view6d button{min-width:35px;min-height:34px;padding:6px 8px;background:#172c36cc;border:1px solid #ffffff50;color:white;border-radius:11px;font:600 12px/1.2 system-ui,sans-serif;box-shadow:0 3px 8px #0004;cursor:pointer;touch-action:manipulation}
#view6d button:focus-visible{outline:3px solid #ffca70}
#view6d button:active{background:#3c746b}
#view6d .wide{min-width:64px}
#view6d .view-help{color:#fff7eb;background:#1c2a34bc;border-radius:8px;padding:5px 7px;font:10px/1.3 system-ui,sans-serif;text-align:right;max-width:132px}
.dim{z-index:30}.sheet{z-index:31}.toast{z-index:33}
@media(max-width:560px){#view6d{right:8px;top:calc(var(--st) + 212px)}#view6d button{min-width:32px;min-height:32px;padding:5px 7px}#view6d .view-help{font-size:9px}}

/* Collapsible camera controls to avoid blocking seat name tags. */
#view6d{right:8px;top:calc(var(--st) + 199px);width:150px;max-width:150px}
#view6dPanel[hidden]{display:none!important}
#view6dPanel{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#view6d .view-row{width:100%}
#view6d .view-row button{flex:1;min-width:0;white-space:nowrap}
#view6d button{font-size:11px}
#view6dToggle{width:100%;background:#20544ddd!important;border:1px solid #ffffff90!important}
#view6d .view-help{max-width:150px}
@media(max-width:560px){#view6d{top:calc(var(--st) + 181px)}}

/* Ocean View 2.0: calm compact scene navigation; controls never appear in other themes. */
#oceanDock20{position:fixed;top:calc(var(--st) + 194px);left:10px;z-index:7;display:none;
  padding:9px;border:1px solid #ffffff79;border-radius:15px;
  background:linear-gradient(145deg,#123c4fdf,#194b59db);color:#f4f7ed;box-shadow:0 5px 25px #081c2870;
  width:160px;backdrop-filter:blur(9px);}
#oceanDock20.show{display:block}
#oceanDock20 .ocean-label20{font:700 10px/1.2 system-ui,sans-serif;letter-spacing:1.7px;color:#cae9e8;margin:0 0 7px 2px}
#oceanDock20 .ocean-label20 strong{color:#fff0bb;font-size:11px}
#oceanDock20 .ocean-actions20{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#oceanDock20 button{font:600 11px/1.2 system-ui,sans-serif;color:#fff;border:1px solid #a4d7d15e;background:#dff6f51b;
  border-radius:10px;min-height:36px;padding:5px;touch-action:manipulation;cursor:pointer}
#oceanDock20 button:active{background:#eff9ee4d}
#oceanDock20 button:focus-visible{outline:2px solid #ffe5a0}
#oceanDock20 button:disabled{opacity:.42;cursor:not-allowed}
#oceanDock20 .ocean-caption20{font:10px/1.25 system-ui,sans-serif;opacity:.76;margin-top:7px;text-align:center}
@media(max-width:560px){#oceanDock20{top:calc(var(--st) + 183px);width:148px;left:8px}
  #oceanDock20 button{min-height:32px;font-size:10px}}

/* 30-seat numbered directory: provides a dependable mobile route to every desk */
#seatMap30{display:none}
#seatMap30.show{display:inline-flex}
.seat-map30{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}
.seat-map30 button{border:1px solid var(--line);border-radius:11px;padding:9px 2px;min-height:48px;font-family:'Jua',sans-serif;background:#fff;color:var(--ink);cursor:pointer}
.seat-map30 button.empty{background:#e3f6ec;border-color:#89d8ad}
.seat-map30 button.occupied{background:#ebe7df;color:#89847a}
.seat-map30 button.mine{background:#f5e2a1;border-color:#e19b37}
.seat-map30 button:disabled{cursor:default}
.seat-map30 span{display:block;font:10px/1.3 system-ui,sans-serif;margin-top:3px}
@media(max-width:390px){.seat-map30{gap:5px}.seat-map30 button{min-height:43px;font-size:12px}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="labels"></div>
<div id="oceanDock20" role="group" aria-label="오션뷰 2.0 공간 조작">
 <div class="ocean-label20">OCEAN VIEW <strong>2.0</strong></div>
 <div class="ocean-actions20">
  <button type="button" id="oceanSea20" title="창밖 바다 감상">🌊 바다</button>
  <button type="button" id="oceanDesk20" title="내 책상으로 이동" disabled>📖 책상</button>
  <button type="button" id="oceanHome20" title="전체 열람실 보기">🏠 전체</button>
  <button type="button" id="oceanEntrance30" title="캐릭터 뒤에서 입구 보기" hidden>👤 입구</button>
  <button type="button" id="oceanSound20" title="파도 소리 켜기" aria-pressed="false">🔈 파도</button>
 </div>
 <div class="ocean-caption20">좌석 번호 메뉴로 먼 자리도 선택할 수 있어요</div>
</div>

<div id="view6d" role="group" aria-label="열람실 카메라 조정">
 <button type="button" id="view6dToggle" aria-expanded="false" aria-controls="view6dPanel">🎥 시점 조정</button>
 <div id="view6dPanel" hidden>
  <div class="view-row"><button type="button" id="camLeft6d" aria-label="왼쪽 보기">◀</button><button type="button" id="camOut6d" class="wide">🌄 창밖</button><button type="button" id="camRight6d" aria-label="오른쪽 보기">▶</button></div>
  <div class="view-row"><button type="button" id="camMinus6d" aria-label="화면 축소">−</button><button type="button" id="camHome6d" class="wide">⌂ 정면</button><button type="button" id="camPlus6d" aria-label="화면 확대">＋</button></div>
  <div class="view-row"><button type="button" id="camForward6e" aria-label="앞줄 보기">↑앞</button><button type="button" id="camTiltUp6e" aria-label="위를 보기">↑시선</button><button type="button" id="camTiltDown6e" aria-label="아래를 보기">↓시선</button><button type="button" id="camBack6e" aria-label="뒷줄 보기">↓뒤</button></div>
  <div class="view-row"><button type="button" id="camEco6e" class="wide" aria-pressed="false">⚡ 저사양</button></div>
  <div class="view-help">모바일 좌우 드래그: 회전<br>상하 드래그: 앞·뒤 이동<br>두 손가락: 확대·위치<br>PC: 드래그 시선, Shift+드래그 이동</div>
 </div>
</div>

<div class="top"><div class="wrap">
  <div class="row1">
    <div class="brand">STUDY ROOM <small>캐릭터 시점·충돌회피·4면 도서관 시험 · 공개 금지</small></div>

</div></div>

    <div style="display:flex;gap:6px"><button class="btn sm" id="breakBtn" aria-label="쉬는 시간">☕ 쉬기</button><button class="btn sm" id="hStop">공부 끝내기</button></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const fmtClock=s=>{s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const fmtMin=s=>Math.floor(s/60)+'분';

if(!window.THREE){$('#loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요.';return;}

/* ---------- data ---------- */
const SUBJECTS=['국어','수학','영어','한국사','통합사회','통합과학','기타'];
const ADJ=['푸른','조용한','반짝','느긋한','단단한','새벽','포근한','맑은','작은','용감한','성실한','몽글'];
const NOUN=['별','고래','연필','부엉이','나무','구름','책갈피','등대','다람쥐','노트','달','펭귄'];
const genNick=()=>pick(ADJ)+pick(NOUN)+Math.floor(rnd(10,99));
const SCHOOLS=['복정고','한빛고','새솔고'];
const GRADES=['1학년','2학년','3학년'];

// 실제 시각 구간 [a,b]를 한국 날짜·심야(0~6시) 단위로 나눔
function splitInterval(a,b){
  const out={};let t=a;
  while(t<b){
    const k=t+KST, ds=Math.floor(k/DAY)*DAY, six=ds+6*H, next=k<six?six:ds+DAY;
    const end=Math.min(b,next-KST), sec=(end-t)/1000, key=new Date(ds).toISOString().slice(0,10);
    const o=out[key]||(out[key]={sec:0,night:0});o.sec+=sec;if(k<six)o.night+=sec;
    t=end;
  }
  return out;
}

/* v0.6-D.1: reclaim per-room geometry, noncached materials and CanvasTexture. */
function disposeObject6e(root){
 if(!root)return;
 const shared=new Set(Object.values(matCache)),geos=new Set(),mats=new Set(),maps=new Set();
 root.traverse(o=>{
  if(o.userData)o.userData.disposed=true;
  if(o.geometry&&!geos.has(o.geometry)){geos.add(o.geometry);o.geometry.dispose();}
  for(const m of (Array.isArray(o.material)?o.material:[o.material])){
   if(!m||shared.has(m)||mats.has(m))continue;
   mats.add(m);
   for(const k of ['map','alphaMap','aoMap','emissiveMap','normalMap','roughnessMap','metalnessMap','bumpMap','lightMap']){
    const t=m[k];if(t&&!maps.has(t)){maps.add(t);t.dispose();}
   }
   m.dispose();
  }
 });
}

function computeLayout(){
  const portrait=innerWidth/innerHeight<.85,large=isClassRoom30(roomKey);
  const cols=large?(portrait?3:6):(portrait?2:4);
  const count=seatCapacity(roomKey),rows=count/cols,dx=large?(portrait?1.85:2.1):(portrait?1.95:2.3),dz=large?2.08:2.15;
  const seats=[];
  for(let i=0;i<count;i++){const c=i%cols,r=Math.floor(i/cols);seats.push({x:(c-(cols-1)/2)*dx,z:(r-(rows-1)/2)*dz})}
  const halfW=cols*dx/2+1.0, halfD=rows*dz/2+1.1, maxZ=Math.max(...seats.map(q=>q.z));
  const aisles=[];for(let c=0;c<cols-1;c++)aisles.push((c+.5-(cols-1)/2)*dx);
  return {portrait,cols,rows,dx,dz,seats,halfW,halfD,frontZ:maxZ+1.5,door:{x:large?halfW-1.05:halfW-.35,z:maxZ+1.5},aisles};
}

function bookshelf(w,h,parent,x,z,ry){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry||0;parent.add(g);
  const d=.42, fc='#6b4a2e';
  box(.08,h,d,fc,-w/2,h/2,0,g);box(.08,h,d,fc,w/2,h/2,0,g);box(w,h,.04,'#4e3522',0,h/2,-d/2+.02,g,false);
  const shelves=Math.max(3,Math.round(h/.62));
  for(let s=0;s<=shelves;s++){
    const y=s*(h-.06)/shelves+.03;box(w,.06,d,fc,0,y,0,g);
    if(s===shelves)break;
    const sh=(h-.06)/shelves-.08;
    let bx=-w/2+.08;
    while(bx<w/2-.14){
      const bw=rnd(.07,.15), bh=sh*rnd(.62,.95);
      if(Math.random()<.08){bx+=bw*1.5;continue}
      const b=box(bw,bh,d*.8,pick(BOOK),bx+bw/2,y+.03+bh/2,.02,g,false);
      if(Math.random()<.06){b.rotation.z=-.18;b.position.x+=.03}
      bx+=bw+.008;
    }
  }
  return g;
}

  const so=seatObjs[i],occ=rooms[roomKey]?.seats[i]?.occ;

/* Original procedural wave ambience, user-initiated and muted by default. */
let seaAudio20=null,seaAudioSource20=null,seaAudioOsc20=null;
function stopOceanSound20(){
 try{seaAudioSource20?.stop()}catch(_){}
 try{seaAudioOsc20?.stop()}catch(_){}
 if(seaAudio20)seaAudio20.close().catch(()=>{});
 seaAudio20=null;seaAudioSource20=null;seaAudioOsc20=null;
 const b=document.getElementById('oceanSound20');
 if(b){b.textContent='🔈 파도';b.setAttribute('aria-pressed','false')}
}
async function toggleOceanSound20(){
 if(!isOcean20())return;
 if(seaAudio20){stopOceanSound20();return}
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio){toast('이 기기에서는 파도 소리를 지원하지 않아요');return}
 let ctx;
 try{
  ctx=new Audio();const length=Math.round(ctx.sampleRate*2.5);
  const buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1);
  const source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;
  const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=470;
  const gain=ctx.createGain();gain.gain.value=.024;
  const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=.12;
  const depth=ctx.createGain();depth.gain.value=.015;
  osc.connect(depth);depth.connect(gain.gain);
  source.connect(low);low.connect(gain);gain.connect(ctx.destination);
  await ctx.resume();source.start();osc.start();
  seaAudio20=ctx;seaAudioSource20=source;seaAudioOsc20=osc;
  const b=document.getElementById('oceanSound20');
  if(b){b.textContent='🔊 파도 ON';b.setAttribute('aria-pressed','true')}
 }catch(e){
  try{await ctx?.close()}catch(_){}
  stopOceanSound20();toast('파도 소리를 재생할 수 없어요');
 }
}

/* Static box instancing for 30-seat scenes: reduce draw calls, preserve independent seat hitboxes. */
function batchStaticBoxes30(root){
 if(!isClassRoom30(roomKey)||!THREE.InstancedMesh)return {batched:0,groups:0};
 root.updateMatrixWorld(true);
 const sharedMats=new Set(Object.values(matCache)),batches=new Map();
 root.traverse(mesh=>{
  if(!mesh.isMesh||mesh.geometry?.type!=='BoxGeometry'||!sharedMats.has(mesh.material))return;
  if(mesh.userData?.seat!==undefined)return; // seat hitboxes must remain distinct
  const p=mesh.geometry.parameters||{};
  if(!Number.isFinite(p.width)||!Number.isFinite(p.height)||!Number.isFinite(p.depth))return;
  const key=mesh.material.uuid+'_'+Number(Boolean(mesh.castShadow))+'_'+Number(Boolean(mesh.receiveShadow));
  if(!batches.has(key))batches.set(key,{material:mesh.material,cast:mesh.castShadow,receive:mesh.receiveShadow,items:[]});
  batches.get(key).items.push({mesh,transform:mesh.matrixWorld.clone().multiply(new THREE.Matrix4().makeScale(p.width,p.height,p.depth))});
 });
 let n=0,k=0;
 for(const b of batches.values()){
  if(b.items.length<4)continue;
  const inst=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),b.material,b.items.length);
  inst.castShadow=b.cast;inst.receiveShadow=b.receiveShadow;inst.frustumCulled=false;
  b.items.forEach((v,i)=>{inst.setMatrixAt(i,v.transform);v.mesh.parent.remove(v.mesh);v.mesh.geometry.dispose()});
  inst.instanceMatrix.needsUpdate=true;
  root.add(inst);n+=b.items.length;k++;
 }
 return {batched:n,groups:k};
}

function buildEntranceWall30(W,t){
 const g=new THREE.Group();g.name='library-front-wall-30';roomGroup.add(g);
 entranceWall30=g;
 const z=L.frontZ+.74,doorX=L.door.x,doorHalf=.72;
 const openingL=doorX-doorHalf,openingR=doorX+doorHalf;
 const a=openingL+W,b=W-openingR;
 const wall=(width,height,depth,color,x,y,zz)=>box(width,height,depth,color,x,y,zz,g,false);
 wall(a,4.3,.22,t.wall,(-W+openingL)/2,2.15,z);
 if(b>.05)wall(b,4.3,.22,t.wall,(openingR+W)/2,2.15,z);
 wall(doorHalf*2,1.0,.22,t.wall,doorX,3.8,z);
 // Framed opening is aligned to the avatar's spawn position; do not block path.
 for(const x of [openingL,openingR]){
  wall(.17,3.4,.27,t.trim,x,1.7,z-.06);
  wall(.25,.20,.37,'#c6a47a',x,3.43,z-.06);
 }
 wall(doorHalf*2+.25,.18,.30,t.trim,doorX,3.36,z-.07);
 wall(doorHalf*2,.08,.28,'#f1ddad',doorX,3.22,z-.07);
 // Solid timber-backed shelves turn the missing fourth face into a true library wall.
 const innerL=-W+.28,innerR=openingL-.27;
 const span=innerR-innerL,cols=Math.max(2,Math.floor(span/1.45)),step=span/cols;
 for(let i=0;i<cols;i++){
  const x=innerL+(i+.5)*step,unit=Math.max(.84,Math.min(1.3,step-.10));
  bookshelf(unit,3.22,g,x,z-.43,0);

 // Subtle library wall fixtures at either end; avoid the center walkway.
 for(const x of [-W+.27,openingL-.16]){

 // Transparent cutaway is not needed: in overview mode this whole fourth face is hidden.
 g.visible=true;
 return g;
}

function furnitureFootprints30(){
 const obs=[];
 for(let i=0;i<L.seats.length;i++){
  const p=L.seats[i],shared=isSharedSeat(i,roomKey);
  if(shared&&(i%L.cols)%2===0&&isSharedSeat(i+1,roomKey)&&L.seats[i+1]){
   const q=L.seats[i+1],w=Math.abs(q.x-p.x)+1.12;
   obs.push({kind:'desk',owner:i,x:(p.x+q.x)/2,z:p.z,hx:w/2,hz:.43});
  }else if(!shared){
   obs.push({kind:'desk',owner:i,x:p.x,z:p.z,hx:.59,hz:.40});
  }
  // Chairs are also solid while walking; the destination chair is exempt only at arrival.
  obs.push({kind:'chair',owner:i,x:p.x,z:p.z-.65,hx:.31,hz:.31});
 }
 return obs;
}
function pathClear30(from,points,destination){
 const obstacles=furnitureFootprints30();
 let prev=from;
 for(let segment=0;segment<points.length;segment++){
  const to=points[segment],finalApproach=segment===points.length-1;
  const distance=Math.hypot(prev[0]-to[0],prev[1]-to[1]),steps=Math.max(1,Math.ceil(distance/.075));
  for(let i=0;i<=steps;i++){
   const t=i/steps,x=prev[0]+(to[0]-prev[0])*t,z=prev[1]+(to[1]-prev[1])*t;
   for(const o of obstacles){
    if(o.kind==='chair'&&o.owner===destination)continue;
    // Last half-metre intentionally ends at the destination chair. The destination
    // desk is not a corridor obstacle during this short sitting animation.
    if(finalApproach&&o.kind==='desk'&&(
      o.owner===destination||
      (isSharedSeat(destination,roomKey)&&(destination%L.cols)%2===1&&o.owner===destination-1)
    ))continue;
    const pad=.24; // approximately the avatar's footprint, not just its center point
    if(Math.abs(x-o.x)<o.hx+pad&&Math.abs(z-o.z)<o.hz+pad)return false;
   }
  }
  prev=to;
 }
 return true;
}
function safeRoute30(i){
 if(!isClassRoom30(roomKey))return null;
 if(!L.routes30)L.routes30=new Map();
 if(L.routes30.has(i))return L.routes30.get(i);
 const q=L.seats[i],stageZ=q.z-1.30,cols=L.cols;
 const validAisles=L.aisles.filter((ax,c)=>{
  // Never put a vertical walking corridor between the two halves of a shared table.
  for(let r=0;r<L.rows;r++){
   const a=r*cols+c,b=a+1;
   if(isSharedSeat(a,roomKey)&&isSharedSeat(b,roomKey)&&c%2===0)return false;
  }
  return true;
 });
 // End aisles are fallbacks; internal lanes avoid the planters on side walls.
 const candidates=validAisles.sort((a,b)=>Math.abs(a-q.x)-Math.abs(b-q.x));
 // Side perimeter paths are deliberately avoided: plants, wall fixtures and windows live there.
 const source=[L.door.x,L.frontZ-.45];
 for(const ax of candidates){
  const path=[[ax,L.frontZ-.45],[ax,stageZ],[q.x,stageZ],[q.x,q.z-.58]];
  if(pathClear30(source,path,i)){
   const saved={in:path,out:[[q.x,stageZ],[ax,stageZ],[ax,L.frontZ-.45],[L.door.x,L.frontZ-.45]],lane:ax};
   L.routes30.set(i,saved);return saved;
  }
 }
 // Do not animate straight through desks when architecture leaves no passable lane.
 console.warn('30석 좌석 이동 경로를 확보하지 못했습니다:',i);

}

function tick(){const now=performance.now(),step=Math.min(2,Math.max(0,(now-lastTickT)/1000));lastTickT=now;
 if(me.seat!==null&&liveConnected){if(me.state==='study'&&!sessionErr&&localStatus==='running'&&(me.mode==='self'||studyWindowActive())&&!me.pausedAway){
  me.elapsed+=step;if(me.elapsed>=me.len&&!finishing){finishStudy();}
 }else if(me.state==='break'){
  me.breakLeft=Math.max(0,me.breakLeft-step);if(me.breakLeft<=0)resumeStudy();
 }updateHud();}
 for(const s of rooms[roomKey].seats){if(s.occ&&!s.occ.mine&&s.occ.state==='study')s.occ.elapsed=(s.occ.elapsed||0)+step}
 refreshLabels();
}

/* ---------- loop ---------- */
function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;if(d<-Math.PI)d+=Math.PI*2;return a+d*t}
function animChar(c,dt,brk){ // returns true when it should be removed
  const u=c.userData,p=u.parts;const ph=(u.phase+=dt);
  if(u.pop<1&&!u.vanish){u.pop=Math.min(1,u.pop+dt*2.5);const e=1+Math.sin(u.pop*Math.PI)*.18;c.scale.setScalar(Math.max(.001,u.pop*e))}
  if(u.vanish){u.pop-=dt*2.5;c.scale.setScalar(Math.max(.001,u.pop));return u.pop<=0}
  if(u.path&&u.path.length){
    const [tx,tz]=u.path[0];const dx=tx-c.position.x,dz=tz-c.position.z,d=Math.hypot(dx,dz),st=WALK*dt;
    if(d>.001)c.rotation.y=lerpAng(c.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*12));
    if(d<=st){c.position.x=tx;c.position.z=tz;u.path.shift();
      if(!u.path.length){
        if(u.exiting){u.vanish=true}else{u.seated=true;const f=u.onArrive;u.onArrive=null;f&&f()}
      }}
    else{c.position.x+=dx/d*st;c.position.z+=dz/d*st}
    const sw=Math.sin(ph*11);
    p.lL.rotation.x=sw*.6;p.lR.rotation.x=-sw*.6;
    p.lA.rotation.x=-sw*.5;p.rA.rotation.x=sw*.5;p.lA.rotation.z=.12;p.rA.rotation.z=-.12;
    p.head.rotation.x=0;p.head.rotation.z=0;
    c.position.y=Math.abs(Math.cos(ph*11))*.05;
    return false;
  }
  c.position.y+=(0-c.position.y)*.3;
  if(u.seated){
    c.rotation.y=lerpAng(c.rotation.y,0,Math.min(1,dt*10));
    p.lL.rotation.x+=(-1.5-p.lL.rotation.x)*.2;p.lR.rotation.x+=(-1.5-p.lR.rotation.x)*.2;
  }
  if(brk){
    p.rA.rotation.x+=((-2.7)-p.rA.rotation.x)*.08;p.lA.rotation.x+=((-2.7)-p.lA.rotation.x)*.08;
    p.head.rotation.z=Math.sin(ph*1.2)*.12;p.head.rotation.x=-.15;
  }else{
    p.rA.rotation.x+=((-1.15+Math.sin(ph*9)*.05)-p.rA.rotation.x)*.2;
    p.rA.rotation.z=-.25+Math.sin(ph*7)*.06;
    p.lA.rotation.x+=((-1.05)-p.lA.rotation.x)*.1;p.lA.rotation.z=.25;
    p.head.rotation.x=.1+Math.sin(ph*.8)*.04;p.head.rotation.z=Math.sin(ph*.5)*.05;
    p.body.rotation.z=Math.sin(ph*.7)*.02;
  }
  if(u.ring)u.ring.material.opacity=.55+Math.sin(ph*3)*.3;
  return false;
}
let last=performance.now(),lastDraw6e=0;
function frame(t){
  if(document.hidden){last=t;requestAnimationFrame(frame);return;}
  if(eco6e&&t-lastDraw6e<33){requestAnimationFrame(frame);return;}
  lastDraw6e=t;
  const dt=Math.min(.1,(t-last)/1000);last=t;
  updateCamera(dt);
  seatObjs.forEach((so,i)=>{
    const c=so.char;if(!c)return;
    const seat=rooms[roomKey].seats[i];
    animChar(c,dt,seat.occ&&seat.occ.state==='break');
  });
  for(let k=walkers.length-1;k>=0;k--){const c=walkers[k];if(animChar(c,dt,false)){roomGroup.remove(c);disposeObject6e(c);walkers.splice(k,1)}}
  if(following&&me.seat!==null){const so=seatObjs[me.seat];if(so&&so.char){const r=camRange();camZTarget=Math.min(r[1],Math.max(r[0],so.char.position.z+.9))}}
  plants.forEach(p=>{const s=p.scale.x;const tg=Math.max(.001,p.userData.target);if(Math.abs(s-tg)>.002)p.scale.setScalar(s+(tg-s)*.06)});
  if(isOcean20()){animateOcean20(t);oceanDeskLights20(dt)}
  if(isClassRoom30(roomKey)){
   if(me.seat===null&&walkers.length===0&&!entranceAvatar30)createEntranceAvatar30();
   animateEntranceAvatar30(dt);refreshEntranceWall30();
  }
  renderer.render(scene,camera);
  positionLabels();
  requestAnimationFrame(frame);
}
